<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticket Alerts</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#080c14;--panel:#111927;--panel-2:#172235;--line:rgba(186,204,232,.12);--fg:#f5f7fb;--muted:#9aa9bd;--accent:#f5bd59;--accent-2:#ffdf9b;--ok:#48d6a0;--mid:#f5bd59;--low:#ff817b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
body{font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:radial-gradient(ellipse at 50% -18%,rgba(245,189,89,.16),transparent 43%),radial-gradient(ellipse at 100% 28%,rgba(76,119,190,.10),transparent 34%),var(--bg)}
header{padding:28px 18px 22px;max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:15px;color:#17120a;font-size:20px;background:linear-gradient(145deg,var(--accent-2),#e99a25);box-shadow:0 8px 28px rgba(245,189,89,.2)}
h1{font-size:23px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.045em}
.subhead{color:var(--muted);font-size:12px;margin-top:5px}
#upd{color:var(--muted);font-size:11px;background:rgba(17,25,39,.78);border:1px solid var(--line);padding:7px 10px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(12px)}
.nav-wrap{max-width:760px;margin:0 auto;padding-top:4px}
.nav-label{padding:0 18px 7px;color:#91a0b5;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.row{display:flex;gap:8px;overflow-x:auto;padding:7px 18px 17px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(186,204,232,.13);border-radius:14px;padding:11px 15px;font:inherit;font-size:13px;cursor:pointer;background:rgba(19,29,45,.86);color:#d4dce8}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,#ffe3a8,#edac42);color:#211707;font-weight:800;border-color:transparent}
.chip small{display:block;font-size:10px;opacity:.72;margin-top:2px}
#dates .chip{min-width:82px;text-align:center;padding:10px 13px}
main{max-width:760px;margin:0 auto;padding:2px 18px 36px}
.msg{color:#aab7c8;text-align:center;padding:46px 20px;background:rgba(17,25,39,.78);border:1px dashed rgba(186,204,232,.18);border-radius:19px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* buttons */
.btn{flex:1;min-height:43px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:11px 12px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#1a1409;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default}
.btn.alt{background:rgba(72,214,160,.10);color:#6ce0a9;box-shadow:inset 0 0 0 1px rgba(72,214,160,.32)}
.btn.off{background:rgba(255,255,255,.045);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.btn.book{flex:none;min-width:94px;background:transparent;color:var(--accent-2);box-shadow:inset 0 0 0 1px rgba(245,189,89,.38)}
.actions{display:flex;gap:10px}

/* filter / sort bar */
.filter-bar{display:flex;align-items:center;justify-content:center;gap:10px;max-width:724px;margin:2px auto 18px;padding:0 16px}
.filter-trigger{flex:1;max-width:250px;display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 16px;border:1px solid rgba(245,189,89,.28);border-radius:15px;background:linear-gradient(115deg,rgba(245,189,89,.13),rgba(23,34,53,.96) 58%);color:var(--fg);font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.sort-trigger:before{content:"⇅";color:var(--accent-2)}
.filter-clear-quick{background:rgba(255,129,123,.1);border:1px solid rgba(255,129,123,.25);color:#ff817b;border-radius:12px;padding:0 14px;height:46px;font:inherit;font-weight:700;font-size:12px;cursor:pointer}

/* overlays / panels */
.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;z-index:1100;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,6,13,.76);backdrop-filter:blur(5px)}
.panel{width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:22px 20px calc(25px + env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,#182438,#101827 72%);border:1px solid var(--line);border-radius:24px 24px 0 0}
.panel-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:8px;gap:10px}
.panel-sub{color:var(--muted);font-size:12px;margin-bottom:17px}
.x{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.055);color:#e8edf5;font:inherit;font-size:14px;cursor:pointer}
.filter-wrap{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding-top:6px}
.filter-wrap select{width:100%;min-width:0;min-height:48px;padding:12px 34px 12px 13px;border-radius:13px;border:1px solid rgba(186,204,232,.14);background-color:#1a2940;color:#edf2f8;font:inherit;font-size:12px;font-weight:600}
.filter-wrap button{grid-column:1/-1;min-height:45px;border-radius:13px;border:1px solid rgba(245,189,89,.24);background:rgba(245,189,89,.08);color:#f5d49b;font:inherit;font-size:12px;font-weight:750;cursor:pointer}
.mode-option{display:flex;align-items:flex-start;gap:11px;padding:14px 12px;margin-bottom:9px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.035);cursor:pointer}
.mode-option input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.mode-option span{display:grid;gap:4px}
.mode-option b{font-size:13px}
.mode-option small{color:var(--muted);font-size:11px;line-height:1.4}
#budget-area,#manual-area{padding:10px 12px 15px}
.budget-label{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}
#category-budget{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);color:var(--fg);font:inherit}
.category-check{display:flex;align-items:center;gap:10px;padding:11px 9px;border-bottom:1px solid var(--line);font-size:12px}
.category-check input{width:17px;height:17px;accent-color:var(--accent)}
.category-check span{flex:1}
.category-price{color:var(--muted);font-size:11px}
.panel-actions{display:flex;gap:10px;margin-top:17px}
.panel-actions button{flex:1;min-height:45px;border-radius:12px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.btn-cancel{border:1px solid var(--line);background:var(--panel-2);color:var(--fg)}
.btn-go{border:0;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#1a1409}
@media(min-width:600px){.overlay{align-items:center;padding:20px}.panel{border-radius:24px}header{padding-top:34px}}

/* login */
#login-overlay{z-index:100000;background:rgba(0,0,0,.85);align-items:center;padding:20px}
#login-overlay section{width:100%;max-width:360px;padding:24px;border-radius:16px;background:var(--panel)}
#tracking-pin{width:100%;padding:14px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit}

/* seat classes */
.classes{background:rgba(5,10,18,.28);border:1px solid rgba(186,204,232,.08);border-radius:14px;padding:3px 13px}
.cls{display:flex;align-items:center;gap:9px;font-size:12px;padding:10px 0}
.cls+.cls{border-top:1px solid rgba(255,255,255,.055)}
.cls .name{flex:1;color:#e8edf5;font-weight:650}
.cls .st{color:#a5b2c4;font-size:11px;min-width:83px;text-align:right}
.meter{display:inline-flex;gap:3px;flex:none}
.meter i{width:6px;height:11px;border-radius:3px;background:#343c4c}
.l3 i:nth-child(-n+3){background:var(--ok)}
.l2 i:nth-child(-n+2){background:var(--mid)}
.l1 i:nth-child(-n+1){background:var(--low)}
.re{display:block;font-size:10px;color:var(--ok);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
.tag{font-size:10px;font-weight:700;padding:4px 9px;border-radius:999px;color:#f3d39a;background:rgba(245,189,89,.09);border:1px solid rgba(245,189,89,.16)}

/* theatre > movie > combo > tiles */
.th-head{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 2px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2)}
.th-head:first-child{margin-top:0}
.th-head small{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none}
.movie-name{margin:12px 2px 6px;font-size:16px;font-weight:800;letter-spacing:-.02em}
.combo{padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(21,32,49,.98),rgba(14,21,33,.98));box-shadow:0 8px 22px rgba(0,0,0,.16)}
.combo-head{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;margin-bottom:11px}
.combo-head.no-poster{grid-template-columns:1fr}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:rgba(255,255,255,.03);box-shadow:0 5px 15px rgba(0,0,0,.3)}
.combo-lang{font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.censor-badge{font-size:9px;font-weight:800;padding:2px 5px;border:1px solid rgba(186,204,232,.2);border-radius:5px;color:#a5b2c4;line-height:1.2}
.genre{color:var(--muted);font-size:11px;margin-top:3px}
.combo-actions{display:flex;align-items:center;gap:10px;margin-top:8px}
.combo-trailer{color:var(--accent-2);font-size:11px;font-weight:800;text-decoration:none}
.combo-sel{border:1px solid rgba(245,189,89,.3);background:rgba(245,189,89,.08);color:#f5d49b;border-radius:9px;padding:5px 10px;font:inherit;font-size:11px;font-weight:800;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:7px;min-height:46px;padding:7px 8px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.04);cursor:pointer}
.tile.sel{border-color:var(--accent);background:rgba(245,189,89,.12)}
.tile.tracked{border-color:rgba(72,214,160,.45);background:rgba(72,214,160,.08)}
.tile.pend{opacity:.7}
.tile.closed{opacity:.5}
.tile-check{width:16px;height:16px;margin:0;flex:none;accent-color:var(--accent)}
.tile-main{flex:1;min-width:0;display:grid}
.tile-time{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile-screen{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-meta{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ok);font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;background:#4a5468;display:inline-block}
.dot.s3{background:var(--ok)}.dot.s2{background:var(--mid)}.dot.s1{background:var(--low)}
.detail-time{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.detail-time b{font-size:20px;color:var(--accent-2)}
.detail-time span{color:var(--muted);font-size:12px}
.grp-head{margin:8px 2px 0}

/* batch bar, select bar, toast, selection list */
.select-bar{max-width:760px;margin:0 auto;padding:0 18px 12px;display:flex;justify-content:flex-end}
.select-bar[hidden]{display:none}
.select-bar .btn{flex:none;min-height:38px;padding:0 16px}
.batch-bar{position:sticky;bottom:12px;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 12px 14px;margin:0 auto 16px;width:calc(100% - 36px);max-width:724px;border:1px solid var(--line);border-radius:15px;background:#182438;box-shadow:0 8px 25px #0008;overflow:hidden}
.batch-bar[hidden]{display:none}
.batch-count{flex:1 1 100%;font-size:12px;color:var(--muted)}
.batch-bar .btn{min-height:40px}
.batch-progress{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.08);overflow:hidden}
.batch-progress[hidden]{display:none}
.batch-progress i{position:absolute;top:0;bottom:0;width:40%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent-2));animation:bp 1.1s ease-in-out infinite}
@keyframes bp{0%{left:-40%}100%{left:100%}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:1200;max-width:min(92vw,420px);padding:11px 15px;border-radius:13px;background:#2a1f12;border:1px solid rgba(245,189,89,.45);color:#ffe3a8;font-size:12px;font-weight:600;line-height:1.4;box-shadow:0 8px 25px #0009}
.toast[hidden]{display:none}
.sel-date{margin:14px 0 4px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2)}
.sel-theatre{margin:8px 0 6px;font-size:13px;font-weight:800}
.sel-movie{padding:9px 11px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.sel-title{font-size:13px;font-weight:800;margin-bottom:6px}
.sel-lang{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px}
.sel-chips{display:flex;flex-wrap:wrap;gap:6px}
.sel-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#f3d39a;background:rgba(245,189,89,.09);border:1px solid rgba(245,189,89,.18)}
.sel-chip button{width:20px;height:20px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:var(--fg);font-size:10px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">🎫</div>
    <div>
      <h1>Ticket Alerts</h1>
      <div class="subhead">Track any seat category and get notified instantly</div>
    </div>
  </div>
  <div id="upd"></div>
</header>

<div class="nav-wrap">
  <div class="nav-label">Choose a theatre</div>
  <nav class="row" id="venues" aria-label="Theatres"></nav>
  <div class="nav-label">Select a date</div>
  <nav class="row" id="dates" aria-label="Dates"></nav>
</div>

<div class="filter-bar">
  <button type="button" class="filter-trigger" id="filter-open">⚙ Filters</button>
  <button type="button" class="filter-trigger sort-trigger" id="sort-open">Time ↑</button>
  <button type="button" class="filter-clear-quick" id="filter-clear-quick" hidden>✕ Clear</button>
</div>

<div class="overlay" id="filter-overlay" hidden>
  <section class="panel" role="dialog" aria-modal="true">
    <div class="panel-head"><strong>Filter shows</strong><button type="button" class="x" data-filter-close aria-label="Close">✕</button></div>
    <div class="filter-wrap" id="filters"></div>
  </section>
</div>

<div class="overlay" id="category-overlay" hidden>
  <section class="panel" role="dialog" aria-modal="true">
    <div class="panel-head"><strong>Choose what to track</strong><button type="button" class="x" id="category-close">✕</button></div>
    <div class="panel-sub" id="category-sub"></div>
    <label class="mode-option"><input type="radio" name="track-mode" value="all"><span><b>All Categories</b><small>Include new categories automatically, whatever their price.</small></span></label>
    <label class="mode-option"><input type="radio" name="track-mode" value="budget"><span><b>All Categories Under My Budget</b><small>Automatically include new categories within your price limit.</small></span></label>
    <div id="budget-area" hidden>
      <label class="budget-label" for="category-budget">Maximum ticket price (₹)</label>
      <input id="category-budget" type="number" min="1" placeholder="Example: 150">
    </div>
    <label class="mode-option"><input type="radio" name="track-mode" value="manual"><span><b>Choose Categories</b><small>Only the categories you select will be tracked.</small></span></label>
    <div id="manual-area" hidden><div id="category-options"></div></div>
    <div class="panel-actions">
      <button type="button" class="btn-cancel" id="category-cancel">Cancel</button>
      <button type="button" class="btn-go" id="category-save">Save Selection</button>
    </div>
  </section>
</div>

<div class="overlay" id="login-overlay" hidden>
  <section>
    <h2 style="margin-top:0">🔐 Enter PIN</h2>
    <p>Enter the 6-digit PIN to enable batch tracking.</p>
    <input id="tracking-pin" type="password" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" autocomplete="off">
    <p id="login-error" style="color:#ff6464"></p>
    <div style="display:flex;gap:10px">
      <button class="btn off" id="login-cancel">Cancel</button>
      <button class="btn" id="login-submit">Unlock</button>
    </div>
  </section>
</div>

<div class="select-bar" id="select-bar" hidden>
  <button class="btn alt" id="select-all" type="button">Select all</button>
</div>

<main id="list"></main>

<div class="batch-bar" id="batch-bar" hidden>
  <span class="batch-count" id="batch-count">0 shows selected</span>
  <button class="btn off" id="batch-clear" type="button">Clear</button>
  <button class="btn off" id="batch-view" type="button">View</button>
  <button class="btn" id="batch-continue" type="button">Track Selected</button>
  <div class="batch-progress" id="batch-progress" hidden><i></i></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<div class="overlay" id="sort-overlay" hidden>
  <section class="panel" role="dialog" aria-modal="true">
    <div class="panel-head"><strong>Sort shows</strong><button type="button" class="x" id="sort-close">✕</button></div>
    <div class="panel-sub" id="sort-sub"></div>
    <label class="mode-option"><input type="radio" name="sort-mode" value="time-asc"><span><b>Time · earliest first</b><small>Movies with the earliest show first; show times in order.</small></span></label>
    <label class="mode-option"><input type="radio" name="sort-mode" value="time-desc"><span><b>Time · latest first</b><small>Movies with the latest show first; show times reversed.</small></span></label>
    <label class="mode-option"><input type="radio" name="sort-mode" value="movie-asc"><span><b>Movie · A to Z</b><small>Movies alphabetically inside each theatre.</small></span></label>
    <div class="panel-actions"><button type="button" class="btn-go" id="sort-done">Done</button></div>
  </section>
</div>

<div class="overlay" id="sel-overlay" hidden>
  <section class="panel" role="dialog" aria-modal="true">
    <div class="panel-head"><strong>Selected shows</strong><button type="button" class="x" id="sel-close">✕</button></div>
    <div class="panel-sub" id="sel-sub"></div>
    <div id="sel-list"></div>
    <div class="panel-actions"><button type="button" class="btn-go" id="sel-done">Done</button></div>
  </section>
</div>

<div class="overlay" id="detail-overlay" hidden>
  <section class="panel" role="dialog" aria-modal="true">
    <div class="panel-head"><strong id="detail-title">Show</strong><button type="button" class="x" id="detail-close">✕</button></div>
    <div id="detail-body"></div>
  </section>
</div>

<script>
// ── Settings ──────────────────────────────────────────────
const BOT = "Bms_ticketAlert_bot";
const CUTOFF_MIN = 10;
const PENDING_MIN = 6;                    // must outlast the ~5 min raw.githubusercontent.com cache
const LOCAL_TTL = PENDING_MIN * 60000;    // how long an API-confirmed result overrides the file
const THEATRES = {
  INTO: "INOX Marina Mall", PVHR: "PVR Heritage ECR", MCSK: "Miraj Sekaran Mall",
  TVHP: "Vijay Park Injambakkam", CBMC: "Cinepolis BSR Mall", MAYJ: "Mayajaal ECR", ACON: "AGS Navalur"
};
const STATUS = { "3": "Available", "2": "Filling fast", "1": "Almost full", "0": "Sold out" };
const EMPTY_FILTERS = { movie: "", language: "", dimension: "", screen: "", time: "" };
const RAW = "https://raw.githubusercontent.com/Hagema2025/bms-theatre-bot";
const TRACKING_API = "https://final-bms-bot.onrender.com";

// Fresh commit passed in by the bot's "Back to app" button (?sha=<40 hex chars>)
const SHA_PARAM = new URLSearchParams(location.search).get("sha") || "";
let SHA = /^[0-9a-f]{40}$/.test(SHA_PARAM) ? SHA_PARAM : null;
let SHA_UNTIL = Date.now() + PENDING_MIN * 60000;
const activeSha = () => (SHA && Date.now() < SHA_UNTIL) ? SHA : null;
function useFreshSha(sha) {
  if (/^[0-9a-f]{40}$/.test(sha || "")) { SHA = sha; SHA_UNTIL = Date.now() + PENDING_MIN * 60000; }
}

// ── State ─────────────────────────────────────────────────
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const S = {
  venue: store.get("venue", "INTO"),
  date: null,
  state: {}, track: {}, updated: {}, failed: {},
  filters: { ...EMPTY_FILTERS },
  selected: new Set(),
  local: {}   // API-confirmed results: key -> { tracked, ts, mode, max_price, categories }
};
if (S.venue !== "ALL" && !THEATRES[S.venue]) S.venue = "INTO";
S.sort = (() => {
  const x = store.get("sort", null);
  if (x && ["time", "movie", "theatre"].includes(x.by) && ["asc", "desc"].includes(x.dir)) return x;
  return { by: "time", dir: "asc" };
})();

const venuesOf = v => v === "ALL" ? Object.keys(THEATRES) : [v];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

// ── Data ──────────────────────────────────────────────────
async function getJson(folder, venue) {
  const sha = folder === "tracking" ? activeSha() : null;
  const urls = [];
  if (sha) urls.push(`${RAW}/${sha}/docs/${folder}/${venue}.json`);       // fresh, never cached before
  urls.push(`${RAW}/data/docs/${folder}/${venue}.json?t=${Date.now()}`);  // normal branch (may be ~5 min stale)
  for (const url of urls) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (r.status === 404) {
        if (url === urls[urls.length - 1]) return {};
        continue;
      }
      if (!r.ok) continue;
      return JSON.parse(await r.text());
    } catch {}
  }
  return null;
}

async function loadState(venue) {
  const st = await getJson("state", venue);
  S.failed[venue] = st === null;
  if (st) {
    S.updated[venue] = st._updated;
    delete st._updated;
    S.state[venue] = st;
  }
}

// Combo records -> { date: { session: entry } }; old date-keyed entries are still read.
function flattenTracking(tr) {
  const out = {};
  for (const [k, v] of Object.entries(tr || {})) {
    if (/^\d{8}$/.test(k)) {
      out[k] = { ...(out[k] || {}), ...v };
    } else if (v && v.tracking && v.date) {
      out[v.date] = out[v.date] || {};
      for (const [sid, e] of Object.entries(v.tracking)) out[v.date][sid] = e;
    }
  }
  return out;
}

const trackingRequestId = {};
async function loadTracking(venue) {
  const requestId = (trackingRequestId[venue] || 0) + 1;
  trackingRequestId[venue] = requestId;
  const tr = await getJson("tracking", venue);
  if (requestId !== trackingRequestId[venue]) return;   // a newer request has started
  if (tr !== null) S.track[venue] = flattenTracking(tr);
}

async function load(venue) {
  await Promise.all(venuesOf(venue).map(v => Promise.all([loadState(v), loadTracking(v)])));
}

// Tracking info for one show. A short-lived overlay (S.local) from the API
// response wins until the GitHub file catches up or the TTL expires.
function trackOf(v, d, s) {
  const key = `${v}_${d}_${s}`;
  const base = (((S.track[v] || {})[d] || {})[s]) || {};
  const o = S.local[key];
  if (!o) return base;
  if (Date.now() - o.ts > LOCAL_TTL || !!base.tracked === o.tracked) {
    delete S.local[key];
    return base;
  }
  return o.tracked
    ? { ...base, tracked: true, mode: o.mode, max_price: o.max_price, categories: o.categories }
    : { ...base, tracked: false };
}
const isTracked = (v, d, s) => !!trackOf(v, d, s).tracked;

// ── Pending (waiting for bot) ─────────────────────────────
function confirmed(p, t) {
  if (p.a === "unt") return !t.tracked;
  if (!t.tracked) return false;
  const i = p.intent;
  if (!i) return true;
  if ((t.mode || "all") !== i.mode) return false;
  if (i.mode === "budget") {
    const saved = Number(t.max_price), expected = Number(i.max_price);
    return Number.isFinite(saved) && Number.isFinite(expected) && Math.abs(saved - expected) < 0.01;
  }
  if (i.mode === "manual") {
    const norm = c => [...new Set(Array.isArray(c) ? c : [])].sort();
    return JSON.stringify(norm(t.categories)) === JSON.stringify(norm(i.categories));
  }
  return true;
}

function pending(v, d, s) {
  const key = `${v}_${d}_${s}`;
  const all = store.get("pend", {});
  const p = all[key];
  if (!p) return null;
  if (Date.now() - p.ts > PENDING_MIN * 60000) return null;
  if (confirmed(p, trackOf(v, d, s))) {
    delete all[key];
    store.set("pend", all);
    return null;
  }
  return p.a;
}

function prunePending() {
  const all = store.get("pend", {});
  let changed = false;
  for (const [key, p] of Object.entries(all)) {
    const [v, d, id] = key.split("_");
    const expired = Date.now() - p.ts > PENDING_MIN * 60000;
    const isConfirmed = !!S.track[v] && confirmed(p, trackOf(v, d, id));
    if (expired || isConfirmed) {
      delete all[key];
      changed = true;
      if (expired && !isConfirmed) notify("Couldn't confirm your last request. Open the bot in Telegram to check, then try again.");
    }
  }
  if (changed) store.set("pend", all);
}

function notify(msg) {
  if (tg && tg.showAlert && tg.isVersionAtLeast("6.2")) tg.showAlert(msg);
  else alert(msg);
}

// ── Login + batch tracking ────────────────────────────────
let trackingToken = sessionStorage.getItem("tracking_token") || null;
let categorySelection = null, batchSelection = [];
let preparedBatchActions = [], preparedBatchIntents = {};
let batchBusy = false;

function openLogin() {
  $("login-overlay").hidden = false;
  $("tracking-pin").value = "";
  $("login-error").textContent = "";
}
function closeLogin() { $("login-overlay").hidden = true; }

async function trackingLogin() {
  const pin = $("tracking-pin").value.trim();
  const error = $("login-error"), button = $("login-submit");
  if (!/^\d{6}$/.test(pin)) { error.textContent = "Enter a valid 6-digit PIN."; return false; }
  button.disabled = true;
  error.textContent = "Verifying...";
  try {
    const response = await fetch(`${TRACKING_API}/api/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pin })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Login failed.");
    trackingToken = data.token;
    sessionStorage.setItem("tracking_token", trackingToken);
    closeLogin();
    return true;
  } catch (e) {
    error.textContent = e.message || "Unable to connect.";
    return false;
  } finally {
    button.disabled = false;
  }
}

function resultOk(r) {
  if (!r) return false;
  if (typeof r.success === "boolean") return r.success;
  if (typeof r.ok === "boolean") return r.ok;
  return ["ok", "success", "tracked"].includes(String(r.status || "").toLowerCase());
}

function setBatchBusy(on) {
  batchBusy = on;
  $("batch-continue").disabled = on;
  $("batch-clear").disabled = on;
  $("batch-view").disabled = on;
  $("batch-continue").textContent = on ? "Tracking…" : "Track Selected";
  $("batch-progress").hidden = !on;
  updateBatchUI();
}

async function submitBatchTracking(actions, intents = {}) {
  if (batchBusy) return;
  if (!trackingToken) {
    preparedBatchActions = actions;
    preparedBatchIntents = intents;
    openLogin();
    return;
  }
  setBatchBusy(true);
  try {
    const response = await fetch(`${TRACKING_API}/api/tracking`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${trackingToken}` },
      body: JSON.stringify({ actions })
    });
    const data = await response.json();
    if (response.status === 401) {
      trackingToken = null;
      sessionStorage.removeItem("tracking_token");
      preparedBatchActions = actions;
      preparedBatchIntents = intents;
      openLogin();
      return;
    }
    if (!response.ok) throw new Error(data.error || "Tracking request failed.");

    const results = Array.isArray(data.results) ? data.results : [];
    const failedLines = [];
    actions.forEach((a, i) => {
      const key = `${a.venue}_${a.date}_${a.session}`;
      const r = results[i];
      if (resultOk(r)) {
        S.local[key] = { tracked: true, ts: Date.now(), ...(intents[key] || { mode: "all", max_price: null, categories: [] }) };
        S.selected.delete(key);
      } else {
        const show = ((S.state[a.venue] || {})[a.date] || {})[a.session];
        failedLines.push(`• ${show ? show.movie + " " + show.time : key}` + (r && (r.message || r.error) ? " – " + (r.message || r.error) : ""));
      }
    });
    renderList();
    updateBatchUI();

    const sha = data.commit_sha || (results.find(r => r && r.commit_sha) || {}).commit_sha;
    if (sha) {
      useFreshSha(sha);
      refreshTracking([...new Set(actions.map(a => a.venue))]);
    }
    if (failedLines.length) notify(`Tracked: ${data.succeeded}\nFailed: ${data.failed}\n\n` + failedLines.join("\n"));
  } catch (e) {
    console.error("Batch tracking error:", e);
    notify(e.message || "Unable to submit batch tracking.");
  } finally {
    setBatchBusy(false);
  }
}

// ── Category picker ───────────────────────────────────────
const pricedClasses = show => Object.entries(show.classes || {}).filter(([name, c]) => name && Number(c.price) > 0);

function openCategoryPicker(v, d, id, show) {
  batchSelection = [];
  const classes = pricedClasses(show);
  if (!classes.length) return notify("No seat categories are available.");

  const key = `${v}_${d}_${id}`;
  const pend = store.get("pend", {})[key];
  const t = trackOf(v, d, id);
  const saved = pend && Date.now() - pend.ts <= PENDING_MIN * 60000
    ? (pend.intent || {})
    : t.tracked ? { mode: t.mode || "all", max_price: t.max_price, categories: t.categories || [] } : {};
  categorySelection = { v, d, id, show, classes };

  $("category-sub").textContent = `${show.movie || "Show"} · ${show.time || ""}`;
  document.querySelectorAll('input[name="track-mode"]').forEach(i => { i.checked = i.value === (saved.mode || "all"); });
  $("category-budget").value = saved.max_price ?? "";
  const selected = saved.categories || [];
  $("category-options").innerHTML = classes.map(([name, c]) => `
    <label class="category-check">
      <input type="checkbox" value="${esc(name)}" ${selected.includes(name) ? "checked" : ""}>
      <span>${esc(name)}</span><small class="category-price">₹${esc(c.price)}</small>
    </label>`).join("");
  updateCategoryMode();
  $("category-overlay").hidden = false;
}

function openBatchCategoryPicker() {
  const shows = [];
  for (const key of S.selected) {
    const [v, d, id] = key.split("_");
    const show = ((S.state[v] || {})[d] || {})[id];
    if (!show || isTracked(v, d, id) || closed(show) || pending(v, d, id)) continue;
    const classes = pricedClasses(show);
    if (classes.length) shows.push({ v, d, id, show, classes });
  }
  if (!shows.length) return notify("No eligible shows selected.");
  batchSelection = shows;

  const categoryMap = new Map();
  shows.forEach(item => item.classes.forEach(([name]) => categoryMap.set(name, (categoryMap.get(name) || 0) + 1)));

  $("category-sub").textContent = `${shows.length} shows selected · Same selection for all`;
  document.querySelectorAll('input[name="track-mode"]').forEach(i => i.checked = i.value === "all");
  $("category-budget").value = "";
  $("category-options").innerHTML = [...categoryMap.entries()].map(([name, count]) => {
    const prices = shows.flatMap(i => i.classes).filter(([n]) => n === name).map(([, c]) => Number(c.price)).filter(p => Number.isFinite(p) && p > 0);
    const lo = Math.min(...prices), hi = Math.max(...prices);
    return `
      <label class="category-check">
        <input type="checkbox" value="${esc(name)}">
        <span>${esc(name)}</span>
        <small class="category-price">${lo === hi ? `₹${lo}` : `₹${lo}–₹${hi}`} · ${count}/${shows.length} shows</small>
      </label>`;
  }).join("");
  updateCategoryMode();
  $("category-overlay").hidden = false;
}

function updateCategoryMode() {
  const mode = document.querySelector('input[name="track-mode"]:checked')?.value || "all";
  $("budget-area").hidden = mode !== "budget";
  $("manual-area").hidden = mode !== "manual";
}
function closeCategoryPicker() { $("category-overlay").hidden = true; categorySelection = null; }

function saveCategorySelection() {
  const isBatch = batchSelection.length > 0;
  if (!isBatch && !categorySelection) return;

  const mode = document.querySelector('input[name="track-mode"]:checked')?.value || "all";
  const maxPrice = Math.round(Number($("category-budget").value));
  const checked = [...document.querySelectorAll("#category-options input[type=checkbox]:checked")].map(i => i.value);

  if (mode === "budget" && (!Number.isFinite(maxPrice) || maxPrice <= 0)) return notify("Please enter a valid maximum price.");
  if (mode === "manual" && !checked.length) return notify("Please select at least one category.");

  if (isBatch) {
    const actions = [], intents = {};
    for (const { v, d, id, classes } of batchSelection) {
      let selection = "a";
      let intent = { mode: "all", max_price: null, categories: [] };
      if (mode === "budget") {
        selection = "b" + maxPrice;
        intent = { mode: "budget", max_price: maxPrice, categories: [] };
      }
      if (mode === "manual") {
        let mask = 0;
        const names = [];
        classes.forEach(([name], i) => { if (checked.includes(name)) { mask |= (1 << i); names.push(name); } });
        if (mask === 0) continue;
        selection = "m" + mask.toString(36);
        intent = { mode: "manual", max_price: null, categories: names };
      }
      actions.push({ action: "track", venue: v, session: id, date: d, selection });
      intents[`${v}_${d}_${id}`] = intent;
    }
    if (!actions.length) return notify("No selected categories match these shows.");
    preparedBatchActions = actions;
    preparedBatchIntents = intents;
    closeCategoryPicker();
    batchSelection = [];
    return submitBatchTracking(actions, intents);
  }

  const { v, d, id, classes } = categorySelection;
  let extra = "a";
  if (mode === "budget") extra = "b" + maxPrice;
  if (mode === "manual") {
    let mask = 0;
    classes.forEach(([name], i) => { if (checked.includes(name)) mask |= (1 << i); });
    extra = "m" + mask.toString(36);
  }
  const intent = { mode, max_price: mode === "budget" ? maxPrice : null, categories: mode === "manual" ? checked : [] };
  closeCategoryPicker();
  press("trk", `${v}_${d}_${id}`, extra, intent);
}

// ── Helpers ───────────────────────────────────────────────
const live = show => Date.parse(show.end) > Date.now();
const closed = show => Date.now() > Date.parse(show.start) + CUTOFF_MIN * 60000;

function dateLabel(code) {
  const d = new Date(+code.slice(0, 4), +code.slice(4, 6) - 1, +code.slice(6));
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((d - t) / 86400000);
  const base = d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  const day = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : d.toLocaleDateString("en-IN", { weekday: "short" });
  return { day, base };
}

// Set innerHTML only if it changed, so the DOM isn't replaced needlessly
function setHtml(el, html) {
  if (el.dataset.h === html) return false;
  el.dataset.h = html;
  el.innerHTML = html;
  return true;
}

function showsInView() {
  const out = [];
  for (const v of venuesOf(S.venue)) {
    const day = (S.state[v] || {})[S.date] || {};
    for (const [id, s] of Object.entries(day)) out.push({ v, id, s, key: `${v}_${S.date}_${id}` });
  }
  return out;
}

const canSelectShow = ({ v, id, s }) => !isTracked(v, S.date, id) && !closed(s) && !pending(v, S.date, id);

function selectableKeys() {
  return showsInView().filter(({ s }) => live(s) && matchesFilters(s)).filter(canSelectShow).map(x => x.key);
}

// ── Top navigation ────────────────────────────────────────
function renderVenues() {
  const all = [["ALL", "All Theatres"], ...Object.entries(THEATRES)];
  setHtml($("venues"), all.map(([code, name]) =>
    `<button class="chip" data-v="${code}" aria-pressed="${code === S.venue}">${esc(name)}</button>`).join(""));
}

function datesFor(v) {
  const set = new Set();
  for (const x of venuesOf(v)) {
    const st = S.state[x] || {};
    Object.keys(st).filter(d => /^\d{8}$/.test(d) && Object.values(st[d]).some(live)).forEach(d => set.add(d));
  }
  return [...set].sort();
}

function renderDates() {
  const dates = datesFor(S.venue);
  if (!dates.includes(S.date)) S.date = dates[0] || null;
  setHtml($("dates"), dates.map(d => {
    const l = dateLabel(d);
    return `<button class="chip" data-d="${d}" aria-pressed="${d === S.date}">${l.day}<small>${l.base}</small></button>`;
  }).join(""));
}

// ── Track / stop button (used inside the show sheet) ──────
function button(v, d, id, show) {
  const key = `${v}_${d}_${id}`;
  const action = pending(v, d, id);

  if (action) {
    const intent = store.get("pend", {})[key]?.intent;
    let label = action === "unt" ? "Stopping…" : "Syncing…";
    if (action === "trk" && intent) {
      label = intent.mode === "manual" ? `Syncing · ${intent.categories.join(", ")}`
        : intent.mode === "budget" ? `Syncing · Under ₹${intent.max_price}` : "Syncing · All Categories";
    }
    return `<button class="btn off" disabled data-wait="${key}">🟡 ${esc(label)} · <span class="cd"></span></button>
            <button class="btn off" data-a="cancel" data-k="${key}">Cancel</button>`;
  }

  if (isTracked(v, d, id)) {
    if (S.selected.size > 0) {
      return `<button class="btn alt" disabled>✓ Tracking</button><button class="btn off" disabled>Stop</button>`;
    }
    return `<button class="btn alt" data-a="edit" data-k="${key}">✓ Tracking · Edit</button>
            <button class="btn off" data-a="unt" data-k="${key}">Stop</button>`;
  }
  if (closed(show)) return `<button class="btn off" disabled>Tracking closed</button>`;
  if (S.selected.size > 0) return `<button class="btn off" disabled>Multi-select active</button>`;
  return `<button class="btn" data-a="pick" data-k="${key}">Track this show</button>`;
}

// ── Filters ───────────────────────────────────────────────
function renderFilters() {
  if (!$("filter-overlay").hidden) { updateFilterUI(); return; }   // never rebuild while in use
  const shows = showsInView().map(x => x.s);
  const options = field => [...new Set(shows.map(s => String(s[field] || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));

  ["movie", "language", "dimension", "screen"].forEach(f => {
    if (S.filters[f] && !options(f).includes(S.filters[f])) S.filters[f] = "";
  });

  const makeSelect = (id, label, values) => `
    <select id="filter-${id}" aria-label="${label}">
      <option value="">All ${label}</option>
      ${values.map(val => `<option value="${esc(val)}" ${S.filters[id] === val ? "selected" : ""}>${esc(val)}</option>`).join("")}
    </select>`;
  const timeOpt = (v, label) => `<option value="${v}" ${S.filters.time === v ? "selected" : ""}>${label}</option>`;

  setHtml($("filters"), `
    ${makeSelect("movie", "Movies", options("movie"))}
    ${makeSelect("language", "Languages", options("language"))}
    ${makeSelect("dimension", "Dimensions", options("dimension"))}
    ${makeSelect("screen", "Screens", options("screen"))}
    <select id="filter-time" aria-label="Show time">
      <option value="">All show times</option>
      ${timeOpt("morning", "Morning (before 12 PM)")}
      ${timeOpt("afternoon", "Afternoon (12–5 PM)")}
      ${timeOpt("evening", "Evening (5–9 PM)")}
      ${timeOpt("night", "Night (9 PM onwards)")}
    </select>
    <button type="button" data-filter-reset>Clear all filters</button>`);
  updateFilterUI();
}

function matchesFilters(show) {
  const f = S.filters;
  if (f.movie && show.movie !== f.movie) return false;
  if (f.language && show.language !== f.language) return false;
  if (f.dimension && show.dimension !== f.dimension) return false;
  if (f.screen && show.screen !== f.screen) return false;
  if (f.time) {
    const hour = Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", hourCycle: "h23" })
      .formatToParts(new Date(show.start)).find(p => p.type === "hour").value);
    if (f.time === "morning" && !(hour < 12)) return false;
    if (f.time === "afternoon" && !(hour >= 12 && hour < 17)) return false;
    if (f.time === "evening" && !(hour >= 17 && hour < 21)) return false;
    if (f.time === "night" && !(hour >= 21 || hour < 5)) return false;
  }
  return true;
}

function updateFilterUI() {
  const n = Object.values(S.filters).filter(Boolean).length;
  $("filter-clear-quick").hidden = n === 0;
  $("filter-open").innerHTML = n
    ? `⚙ Filters <span style="background:var(--accent);color:#000;padding:2px 6px;border-radius:6px;margin-left:4px">${n}</span>`
    : `⚙ Filters`;
}

function clearFilters() {
  S.filters = { ...EMPTY_FILTERS };
  $("filters").dataset.h = "";
  renderFilters();
  renderList();
}

// ── Toast, selection pruning, selection viewer ────────────
let toastTimer = null;
function showToast(msg, ms = 5000) {
  const el = $("toast");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}

function pruneSelection() {
  const gone = [];
  let changed = false;
  for (const key of [...S.selected]) {
    const [v, d, id] = key.split("_");
    if (!S.state[v]) continue;
    const show = ((S.state[v] || {})[d] || {})[id];
    const unavailable = !show || closed(show) || !live(show);
    if (unavailable || isTracked(v, d, id) || pending(v, d, id)) {
      S.selected.delete(key);
      changed = true;
      if (unavailable) gone.push(show ? `${show.movie} ${show.time}` : "A selected show");
    }
  }
  if (gone.length) {
    showToast(gone.length === 1
      ? `${gone[0]} is no longer available and was removed from your selection.`
      : `${gone.length} selected shows are no longer available and were removed from your selection.`);
  }
  if (changed) updateBatchUI();
  return changed;
}

function renderSelection() {
  const keys = [...S.selected];
  $("sel-sub").textContent = `${keys.length} show${keys.length === 1 ? "" : "s"} selected`;

  const tree = {};   // date -> theatre -> movie -> (language + dimension) -> shows
  keys.forEach(key => {
    const [v, d, id] = key.split("_");
    const show = ((S.state[v] || {})[d] || {})[id] || {};
    const movie = show.movie || "Show " + id;
    const lang = show.language || "—", dim = show.dimension || "—";
    const gk = lang + "\u0000" + dim;
    tree[d] = tree[d] || {};
    tree[d][v] = tree[d][v] || {};
    const m = tree[d][v][movie] = tree[d][v][movie] || { groups: {} };
    const g = m.groups[gk] = m.groups[gk] || { lang, dim, items: [] };
    g.items.push({ key, time: show.time || "", start: Date.parse(show.start) || 0, screen: show.screen || "" });
  });

  const venueOrder = Object.keys(THEATRES);
  $("sel-list").innerHTML = Object.keys(tree).sort().map(d => {
    const dl = dateLabel(d);
    const venues = Object.keys(tree[d]).sort((a, b) => venueOrder.indexOf(a) - venueOrder.indexOf(b));
    return `<div class="sel-date">${esc(dl.day)}, ${esc(dl.base)}</div>` + venues.map(v => {
      const movies = Object.entries(tree[d][v]).map(([name, m]) => ({ name, m })).sort((a, b) => a.name.localeCompare(b.name));
      return `<div class="sel-theatre">${esc(THEATRES[v] || v)}</div>` + movies.map(({ name, m }) => {
        const groups = Object.values(m.groups);
        groups.forEach(g => { g.first = Math.min(...g.items.map(i => i.start)); });
        const langFirst = {};
        groups.forEach(g => { langFirst[g.lang] = Math.min(langFirst[g.lang] ?? Infinity, g.first); });
        groups.sort((a, b) => langFirst[a.lang] - langFirst[b.lang] || a.lang.localeCompare(b.lang) || a.first - b.first || a.dim.localeCompare(b.dim));
        return groups.map(g => `
          <div class="sel-movie">
            <div class="sel-title">${esc(name)}</div>
            <span class="sel-lang">${esc(g.lang)} · ${esc(g.dim)}</span>
            <div class="sel-chips">${g.items.sort((a, b) => a.start - b.start).map(it =>
              `<span class="sel-chip"${it.screen ? ` title="${esc(it.screen)}"` : ""}>${esc(it.time)}<button type="button" data-sel-remove="${esc(it.key)}" aria-label="Remove ${esc(it.time)}">✕</button></span>`).join("")}</div>
          </div>`).join("");
      }).join("");
    }).join("");
  }).join("");
}
function openSelection() { if (!S.selected.size) return; renderSelection(); $("sel-overlay").hidden = false; }
function closeSelection() { $("sel-overlay").hidden = true; }

function updateSelectAll() {
  const keys = selectableKeys();
  $("select-bar").hidden = keys.length === 0;
  if (!keys.length) return;
  const allOn = keys.every(k => S.selected.has(k));
  $("select-all").textContent = allOn ? `Deselect all (${keys.length})` : `Select all (${keys.length})`;
  $("select-all").disabled = batchBusy;
}

function updateBatchUI() {
  const count = S.selected.size, plural = count === 1 ? "" : "s";
  $("batch-bar").hidden = count === 0;
  $("batch-count").textContent = batchBusy ? `Tracking ${count} show${plural}…` : `${count} show${plural} selected`;
  if (!$("sel-overlay").hidden) { if (count === 0) closeSelection(); else renderSelection(); }
  updateSelectAll();
}

// ── Sorting ───────────────────────────────────────────────
function effectiveSort() {
  let { by, dir } = S.sort;
  if (by === "theatre") by = "movie";     // layout is always theatre first
  if (by !== "time") dir = "asc";
  return { by, dir };
}

function updateSortUI() {
  const { by, dir } = effectiveSort();
  $("sort-open").textContent = by === "time" ? (dir === "asc" ? "Time ↑" : "Time ↓") : "Movie A–Z";
  const val = by === "time" ? `time-${dir}` : "movie-asc";
  document.querySelectorAll('input[name="sort-mode"]').forEach(i => { i.checked = i.value === val; });
  const vname = S.venue === "ALL" ? "All theatres" : THEATRES[S.venue];
  const dl = S.date ? dateLabel(S.date) : null;
  $("sort-sub").textContent = vname + (dl ? ` · ${dl.day}, ${dl.base}` : "");
}

// ── Render: theatre > movie > language+format combo > tiles ──
const bestStatus = s => Math.max(0, ...pricedClasses(s).map(([, c]) => Number(c.status) || 0));

function groupShows(items) {
  const { by, dir } = effectiveSort();
  const sign = dir === "desc" ? -1 : 1;
  const order = Object.keys(THEATRES);
  const st = it => Date.parse(it.s.start) || 0;
  const theatres = {};

  items.forEach(it => {
    const t = theatres[it.v] = theatres[it.v] || { v: it.v, count: 0, movies: {} };
    t.count++;
    const name = String(it.s.movie || "");
    const m = t.movies[name] = t.movies[name] || { name, first: Infinity, combos: {} };
    m.first = Math.min(m.first, st(it));
    const lang = String(it.s.language || "—"), dim = String(it.s.dimension || "—");
    const c = m.combos[lang + "\u0000" + dim] = m.combos[lang + "\u0000" + dim] || { lang, dim, first: Infinity, items: [] };
    c.first = Math.min(c.first, st(it));
    c.items.push(it);
  });

  return Object.values(theatres)
    .sort((a, b) => order.indexOf(a.v) - order.indexOf(b.v))
    .map(t => {
      const movies = Object.values(t.movies).sort(by === "time"
        ? (a, b) => (a.first - b.first) * sign || a.name.localeCompare(b.name)
        : (a, b) => a.name.localeCompare(b.name));
      movies.forEach(m => {
        const combos = Object.values(m.combos);
        const langFirst = {};
        combos.forEach(c => { langFirst[c.lang] = Math.min(langFirst[c.lang] ?? Infinity, c.first); });
        combos.sort((a, b) => langFirst[a.lang] - langFirst[b.lang] || a.lang.localeCompare(b.lang) || a.first - b.first || a.dim.localeCompare(b.dim));
        combos.forEach(c => c.items.sort((a, b) => (st(a) - st(b)) * sign));
        m.list = combos;
      });
      return { v: t.v, count: t.count, movies };
    });
}

function tileHtml(it) {
  const { v, id, s, key } = it;
  const tracked = isTracked(v, S.date, id);
  const pend = pending(v, S.date, id);
  const cls = ["tile", tracked ? "tracked" : "", pend ? "pend" : "", closed(s) ? "closed" : "", S.selected.has(key) ? "sel" : ""].join(" ");
  const box = canSelectShow(it)
    ? `<input type="checkbox" class="tile-check" data-select-key="${key}" ${S.selected.has(key) ? "checked" : ""} aria-label="Select ${esc(s.time)}">` : "";
  return `<div class="${cls}" data-open="${key}" role="button" tabindex="0">
    ${box}
    <span class="tile-main"><span class="tile-time">${esc(s.time)}</span>${s.screen ? `<span class="tile-screen">${esc(s.screen)}</span>` : ""}</span>
    <span class="tile-meta"><i class="dot s${bestStatus(s)}"></i>${tracked ? "✓" : pend ? "…" : ""}</span>
  </div>`;
}

function comboHtml(c) {
  const s0 = c.items[0].s;
  const poster = s0.poster
    ? `<img src="https://assets-in.bmscdn.com/iedb/movies/images/mobile/thumbnail/xlarge/${esc(s0.poster)}.jpg" class="poster" loading="lazy" onerror="this.style.display='none'">` : "";
  const censor = s0.censor ? `<span class="censor-badge">${esc(s0.censor)}</span>` : "";
  const genre = s0.genre ? `<div class="genre">${esc(s0.genre).replace(/,/g, ", ")}</div>` : "";
  const trailer = s0.trailer ? `<a class="combo-trailer" href="${esc(s0.trailer)}" target="_blank" rel="noopener">▶ Trailer</a>` : "";
  const selectable = c.items.filter(canSelectShow);
  const allOn = selectable.length && selectable.every(i => S.selected.has(i.key));
  const selBtn = selectable.length
    ? `<button type="button" class="combo-sel" data-combo-select="${c.items.map(i => i.key).join(",")}">${allOn ? "Deselect all" : "Select all"}</button>` : "";

  return `<div class="combo">
    <div class="combo-head${poster ? "" : " no-poster"}">
      ${poster}
      <div>
        <div class="combo-lang">${esc(c.lang)} · ${esc(c.dim)} ${censor}</div>
        ${genre}
        <div class="combo-actions">${trailer}${selBtn}</div>
      </div>
    </div>
    <div class="tiles">${c.items.map(tileHtml).join("")}</div>
  </div>`;
}

function renderList() {
  pruneSelection();
  updateBatchUI();
  updateSortUI();
  const el = $("list");

  if (venuesOf(S.venue).every(x => S.failed[x] && !S.state[x])) {
    setHtml(el, `<div class="msg">Couldn’t load shows. Check your connection and try again.</div>`);
    return;
  }

  const items = showsInView().filter(it => live(it.s) && matchesFilters(it.s));
  if (!items.length) {
    setHtml(el, `<div class="msg">No shows match these filters.<br><span style="display:block;margin-top:7px;color:var(--muted)">Try changing or clearing your filters.</span></div>`);
    updateFilterUI();
    return;
  }

  setHtml(el, groupShows(items).map(t =>
    `<div class="th-head">${esc(THEATRES[t.v] || t.v)}<small>${t.count} show${t.count === 1 ? "" : "s"}</small></div>` +
    t.movies.map(m => `<div class="movie-name">${esc(m.name)}</div>` + m.list.map(comboHtml).join("")).join("")
  ).join(""));

  if (!$("detail-overlay").hidden) renderDetail();
  tickCountdown();
  updateFilterUI();
  updateBatchUI();
}

// ── Show detail sheet ─────────────────────────────────────
let detailKey = null;
function openDetail(key) { detailKey = key; renderDetail(); }
function closeDetail() { detailKey = null; $("detail-overlay").hidden = true; }

function renderDetail() {
  if (!detailKey) return;
  const [v, d, id] = detailKey.split("_");
  const s = ((S.state[v] || {})[d] || {})[id];
  if (!s || !live(s)) { closeDetail(); return; }

  const dur = s.duration ? `${Math.floor(s.duration / 60)}h ${s.duration % 60}m` : "";
  const meta = [THEATRES[v], s.language, s.dimension, s.screen].filter(Boolean).map(esc).join(" · ");
  const tags = (s.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  const classes = Object.entries(s.classes || {}).map(([name, c]) => `
    <div class="cls"><span class="meter l${esc(c.status)}" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="name">${esc(name)} ₹${esc(c.price)}</span><span class="st">${STATUS[c.status] || ""}${c.first_seen_status === "0" && c.status !== "0" ? '<span class="re">reopened</span>' : ""}</span></div>`).join("");

  $("detail-title").textContent = s.movie || "Show";
  setHtml($("detail-body"), `
    <div class="panel-sub">${meta}</div>
    <div class="detail-time"><b>${esc(s.time)}</b><span>${dur}</span></div>
    ${tags ? `<div class="tags">${tags}</div>` : ""}
    <div class="classes">${classes}</div>
    <div class="actions" style="margin-top:14px">
      ${button(v, d, id, s)}
      <a class="btn book" href="${esc(s.url)}" target="_blank" rel="noopener">Book</a>
    </div>`);
  $("detail-overlay").hidden = false;
}

function renderUpdated() {
  const el = $("upd");
  const us = venuesOf(S.venue).map(x => S.updated[x]).filter(Boolean);
  if (!us.length) { el.textContent = ""; return; }
  const u = us.reduce((a, b) => Date.parse(a) <= Date.parse(b) ? a : b);
  const m = Math.max(0, Math.round((Date.now() - Date.parse(u)) / 60000));
  el.textContent = m < 1 ? "Data Updated just now" : m < 60 ? `Data Updated ${m} min ago` : `Data Updated ${Math.round(m / 60)} h ago`;
}

function renderAll() {
  renderVenues();
  renderDates();
  renderFilters();
  renderList();
  renderUpdated();
}

// ── Telegram deep link (single show track / stop) ─────────
function press(action, key, extra = "", intent = null) {
  const [v, d, id] = key.split("_");
  const pend = store.get("pend", {});
  SHA = null;               // a new request makes any older SHA stale
  delete S.local[key];
  pend[key] = { a: action, ts: Date.now(), intent };
  store.set("pend", pend);

  const link = `https://t.me/${BOT}?start=${action}_${v}_${id}_${d}` + (extra ? "_" + extra : "");
  renderList();
  if (tg && tg.openTelegramLink) {
    tg.openTelegramLink(link);
    setTimeout(() => { try { tg.close(); } catch {} }, 300);   // user lands in the bot chat and taps "Back to app"
  } else {
    window.open(link, "_blank");
  }
}

// ── Events ────────────────────────────────────────────────
document.addEventListener("click", async e => {
  if (e.target.closest("[data-filter-close]")) { $("filter-overlay").hidden = true; renderFilters(); return; }
  if (e.target.id === "detail-overlay") { closeDetail(); return; }

  const tile = e.target.closest("[data-open]");
  if (tile && !e.target.closest("input")) { openDetail(tile.dataset.open); return; }

  const t = e.target.closest("button");
  if (!t) return;

  if (t.id === "detail-close") { closeDetail(); return; }

  if (t.dataset.comboSelect) {
    if (batchBusy) return;
    const keys = t.dataset.comboSelect.split(",").filter(k => {
      const [v, d, id] = k.split("_");
      const s = ((S.state[v] || {})[d] || {})[id];
      return s && canSelectShow({ v, id, s });
    });
    const allOn = keys.every(k => S.selected.has(k));
    keys.forEach(k => allOn ? S.selected.delete(k) : S.selected.add(k));
    renderList();
    return;
  }
  if (t.dataset.selRemove) { S.selected.delete(t.dataset.selRemove); renderList(); return; }
  if (t.id === "batch-view") { openSelection(); return; }
  if (t.id === "sel-close" || t.id === "sel-done") { closeSelection(); return; }
  if (t.id === "select-all") {
    if (batchBusy) return;
    const keys = selectableKeys();
    const allOn = keys.every(k => S.selected.has(k));
    keys.forEach(k => allOn ? S.selected.delete(k) : S.selected.add(k));
    renderList();
    return;
  }
  if (t.id === "category-close" || t.id === "category-cancel") return closeCategoryPicker();
  if (t.id === "category-save") return saveCategorySelection();
  if (t.id === "filter-open") { $("filter-overlay").hidden = false; return; }
  if (t.id === "sort-open") { updateSortUI(); $("sort-overlay").hidden = false; return; }
  if (t.id === "sort-close" || t.id === "sort-done") { $("sort-overlay").hidden = true; return; }
  if (t.id === "filter-clear-quick" || t.dataset.filterReset !== undefined) return clearFilters();
  if (t.id === "batch-clear") { if (batchBusy) return; S.selected.clear(); renderList(); return; }
  if (t.id === "batch-continue") { if (batchBusy) return; openBatchCategoryPicker(); return; }
  if (t.id === "login-cancel") { preparedBatchActions = []; preparedBatchIntents = {}; closeLogin(); return; }
  if (t.id === "login-submit") {
    const success = await trackingLogin();
    if (success && preparedBatchActions.length) {
      const actions = [...preparedBatchActions], intents = { ...preparedBatchIntents };
      preparedBatchActions = [];
      preparedBatchIntents = {};
      await submitBatchTracking(actions, intents);
    }
    return;
  }

  if (t.dataset.a) closeDetail();

  if (t.dataset.v) {
    S.venue = t.dataset.v;
    store.set("venue", S.venue);
    S.date = null;
    renderAll();
    await load(S.venue);
    prunePending();
    renderAll();
  } else if (t.dataset.d) {
    S.date = t.dataset.d;
    renderDates();
    renderFilters();
    renderList();
  } else if (t.dataset.a === "pick" || t.dataset.a === "edit") {
    const [v, d, id] = t.dataset.k.split("_");
    const show = ((S.state[v] || {})[d] || {})[id];
    if (show) openCategoryPicker(v, d, id, show);
  } else if (t.dataset.a === "unt") {
    press("unt", t.dataset.k);
  } else if (t.dataset.a === "cancel") {
    const all = store.get("pend", {});
    delete all[t.dataset.k];
    store.set("pend", all);
    renderList();
  }
});

document.addEventListener("change", e => {
  if (e.target.name === "track-mode") return updateCategoryMode();
  if (e.target.name === "sort-mode") {
    const [by, dir] = e.target.value.split("-");
    S.sort = { by, dir };
    store.set("sort", S.sort);
    renderList();
    return;
  }
  if (e.target.id && e.target.id.startsWith("filter-")) {
    S.filters[e.target.id.replace("filter-", "")] = e.target.value;
    renderList();
    return;
  }
  if (e.target.matches("[data-select-key]")) {
    const key = e.target.dataset.selectKey;
    if (e.target.checked) S.selected.add(key); else S.selected.delete(key);
    renderList();   // tiles and the "Select all" labels depend on the selection
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    $("filter-overlay").hidden = true;
    $("sort-overlay").hidden = true;
    closeSelection();
    closeDetail();
    if (categorySelection) closeCategoryPicker();
  }
  if (e.key === "Enter" && e.target.matches && e.target.matches("[data-open]")) openDetail(e.target.dataset.open);
});

// ── Refresh loops ─────────────────────────────────────────
async function refreshAll() {
  const venue = S.venue;
  await load(venue);
  prunePending();
  if (venue === S.venue) renderAll();
}

async function refreshState() {
  const venue = S.venue;
  await Promise.all(venuesOf(venue).map(loadState));
  if (venue === S.venue) { renderDates(); renderFilters(); renderList(); renderUpdated(); }
}

async function refreshTracking(vs) {
  await Promise.all((vs || venuesOf(S.venue)).map(v => loadTracking(v)));
  prunePending();
  renderList();
}

function tickCountdown() {
  const waits = document.querySelectorAll("[data-wait]");
  if (!waits.length) return;
  const all = store.get("pend", {});
  let expired = false;
  waits.forEach(b => {
    const p = all[b.dataset.wait];
    const left = p ? Math.max(0, PENDING_MIN * 60 - Math.floor((Date.now() - p.ts) / 1000)) : 0;
    if (!left) expired = true;
    const cd = b.querySelector(".cd");
    if (cd) cd.textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
  });
  if (expired) { prunePending(); renderList(); }
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshAll(); });
setInterval(() => { if (!document.hidden) refreshState(); }, 30000);
setInterval(() => {   // fast poll only for theatres with a pending Telegram request
  if (document.hidden) return;
  const pv = [...new Set(Object.keys(store.get("pend", {})).map(k => k.split("_")[0]))].filter(x => THEATRES[x]);
  if (pv.length) refreshTracking(pv);
}, 5000);
setInterval(() => { if (!document.hidden) refreshTracking(); }, 60000);
setInterval(() => { if (!document.hidden) tickCountdown(); }, 1000);
setInterval(() => { if (!document.hidden && pruneSelection()) renderList(); }, 1000);

renderAll();
refreshAll();
</script>
