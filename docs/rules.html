<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto-track Rules</title>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="window.tgReady&&window.tgReady()"></script>
<style>
:root{color-scheme:dark;--bg:#080c14;--panel:#111927;--panel-2:#172235;--line:rgba(186,204,232,.12);--fg:#f5f7fb;--muted:#9aa9bd;--accent:#f5bd59;--accent-2:#ffdf9b;--ok:#48d6a0;--low:#ff817b;--rule:#a78bfa}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
body{font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:radial-gradient(ellipse at 50% -18%,rgba(245,189,89,.16),transparent 43%),var(--bg)}
header{max-width:760px;margin:0 auto;padding:28px 18px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:15px;color:#17120a;font-size:20px;background:linear-gradient(145deg,var(--accent-2),#e99a25)}
h1{font-size:23px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.045em}
.sub{color:var(--muted);font-size:12px;margin-top:5px}
main{max-width:760px;margin:0 auto;padding:0 18px 120px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn{min-height:43px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#1a1409}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:rgba(255,255,255,.045);color:#d4dce8;box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:12px}
.btn.danger{background:rgba(255,129,123,.1);color:var(--low);box-shadow:inset 0 0 0 1px rgba(255,129,123,.28)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.bar .grow{flex:1}
.msg{color:#aab7c8;text-align:center;padding:40px 20px;background:rgba(17,25,39,.78);border:1px dashed rgba(186,204,232,.18);border-radius:18px;font-size:13px}
.summary{margin:0 0 14px;padding:11px 14px;border-radius:14px;font-size:12px;font-weight:700;color:#d9ccff;background:rgba(167,139,250,.09);border:1px solid rgba(167,139,250,.28)}
.rule{padding:14px;margin-bottom:12px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(21,32,49,.98),rgba(14,21,33,.98))}
.rule.off{opacity:.55}
.rule-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.rule-name{font-size:16px;font-weight:800;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge-unsaved{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;color:var(--accent-2);border:1px solid rgba(245,189,89,.4);background:rgba(245,189,89,.1)}
.rule-desc{color:var(--muted);font-size:12px;margin:6px 0 10px}
.rule-desc b{color:#e8edf5;font-weight:700}
.match{font-size:12px;color:var(--ok);font-weight:700;margin-bottom:10px}
.match.none{color:var(--muted);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.stat{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;color:#d9ccff;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.3)}
.stat.dim{color:var(--muted);background:rgba(255,255,255,.04);border-color:var(--line);font-weight:700}
.waiting{font-size:11px;color:var(--accent-2);font-weight:700;margin:-2px 0 10px}
.rule-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:#343c4c;transition:background .15s}
.sw span:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span:after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
/* tracked / topics sections */
details.sec{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
details.sec>summary{cursor:pointer;list-style:none;padding:10px 12px;font-size:12px;font-weight:800;color:#e8edf5;display:flex;justify-content:space-between;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:after{content:"▾";color:var(--muted)}
details.sec[open]>summary:after{content:"▴"}
.sec-body{padding:2px 12px 12px}
.t-date{margin:10px 0 4px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2)}
.t-theatre{margin:6px 0 4px;font-size:12px;font-weight:800}
.t-movie{padding:7px 9px;margin-bottom:6px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03)}
.t-title{font-size:12px;font-weight:800}
.t-lang{font-size:10px;color:var(--muted);font-weight:700;margin:1px 0 5px}
.t-chips{display:flex;flex-wrap:wrap;gap:5px}
.t-chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:#d9ccff;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25)}
.t-chip.past{opacity:.45}
.topic{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:12px}
.topic+.topic{border-top:1px solid rgba(255,255,255,.06)}
.topic span{color:var(--muted);font-size:11px;display:block}
.topic a{color:var(--accent-2);font-weight:800;font-size:12px;text-decoration:none;padding:5px 11px;border-radius:999px;border:1px solid rgba(245,189,89,.38);white-space:nowrap}
.empty{color:var(--muted);font-size:12px;padding:4px 0}
/* editor */
.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;z-index:1100;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,6,13,.76);backdrop-filter:blur(5px)}
.panel{width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:22px 20px calc(25px + env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,#182438,#101827 72%);border:1px solid var(--line);border-radius:24px 24px 0 0}
.panel-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:14px}
.x{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.055);color:#e8edf5;font:inherit;cursor:pointer}
@media(min-width:600px){.overlay{align-items:center;padding:20px}.panel{border-radius:24px}}
.f{margin-bottom:18px}
.f>label,.f>.lbl{display:block;font-size:12px;font-weight:800;color:var(--accent-2);margin-bottom:4px}
.hint{color:var(--muted);font-size:11px;margin:0 0 8px}
input[type=text],input[type=number],input[type=date],input[type=time],select{width:100%;min-height:46px;padding:11px 13px;border-radius:12px;border:1px solid rgba(186,204,232,.14);background:#1a2940;color:#edf2f8;font:inherit;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid rgba(186,204,232,.13);border-radius:12px;padding:9px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;background:rgba(19,29,45,.86);color:#d4dce8}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,#ffe3a8,#edac42);color:#211707;font-weight:800;border-color:transparent}
.mode{display:flex;gap:10px;align-items:flex-start;padding:12px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);cursor:pointer}
.mode input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.mode b{font-size:13px;display:block}
.mode small{color:var(--muted);font-size:11px}
.sticky{display:flex;gap:10px;margin-top:8px}
.sticky .btn{flex:1}
.err{color:var(--low);font-size:12px;min-height:16px;margin:8px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:1300;max-width:min(92vw,420px);padding:11px 15px;border-radius:13px;background:#2a1f12;border:1px solid rgba(245,189,89,.45);color:#ffe3a8;font-size:12px;font-weight:600}
.toast[hidden]{display:none}
textarea{width:100%;min-height:200px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0c1320;color:#cfe3ff;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
.twin{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--muted);font-size:12px}.twin b{flex:1;min-width:44px;color:#e8edf5;font-size:13px}.twin input{width:auto;flex:none;min-height:42px}
.dirty{color:var(--accent-2);font-size:12px;font-weight:700}
details.wk{margin-top:8px;border:1px solid rgba(167,139,250,.3);border-radius:14px;background:rgba(167,139,250,.05)}
details.wk>summary{cursor:pointer;list-style:none;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.wk>summary::-webkit-details-marker{display:none}
details.wk>summary:after{content:"▾";color:var(--muted)}
details.wk[open]>summary:after{content:"▴"}
.wk-title{font-size:13px;font-weight:800;color:#e8edf5}
.wk-sub{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.wk-tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px;color:#d9ccff;background:rgba(167,139,250,.16);border:1px solid rgba(167,139,250,.35)}
.wk-body{padding:0 12px 12px}
.tp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 4px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07)}
.tp-head:first-child{border-top:0;padding-top:0;margin-top:2px}
.tp-head b{font-size:13px}
.tp-head a{color:var(--accent-2);font-weight:800;font-size:11px;text-decoration:none;padding:4px 10px;border-radius:999px;border:1px solid rgba(245,189,89,.38);white-space:nowrap}
.tp-none{font-size:10px;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true">⚡</div>
    <div>
      <h1>Auto-track rules</h1>
      <div class="sub">Any new show that matches a rule is tracked automatically</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px"><span class="dirty" id="dirty" hidden>Unsaved</span><a href="index.html" class="btn ghost sm" style="text-decoration:none">← Shows</a></div>
</header>

<main>
  <div class="bar">
    <button class="btn" id="new">+ New rule</button>
    <span class="grow"></span>
    <button class="btn ghost" id="io">Import / Export</button>
    <button class="btn" id="save">Save rules</button>
  </div>
  <div id="summary"></div>
  <div id="list"></div>
</main>

<div class="overlay" id="ed" hidden>
  <section class="panel" role="dialog" aria-modal="true" aria-label="Rule editor">
    <div class="panel-head"><strong id="ed-title">New rule</strong><button class="x" id="ed-close" aria-label="Close">✕</button></div>
    <div id="ed-body"></div>
  </section>
</div>

<div class="overlay" id="io-ov" hidden>
  <section class="panel" role="dialog" aria-modal="true" aria-label="Import or export">
    <div class="panel-head"><strong>Import / Export</strong><button class="x" id="io-close" aria-label="Close">✕</button></div>
    <p class="hint">This is the exact JSON the worker will read. Paste a saved config and press Import to replace the rules on this page.</p>
    <textarea id="io-text" spellcheck="false"></textarea>
    <p class="err" id="io-err"></p>
    <div class="sticky">
      <button class="btn ghost" id="io-copy">Copy</button>
      <button class="btn" id="io-import">Import</button>
    </div>
  </section>
</div>

<div class="overlay" id="login" hidden style="align-items:center;padding:20px">
  <section class="panel" style="max-width:360px;border-radius:16px">
    <h2 style="margin:0 0 6px">🔐 Enter PIN</h2>
    <p class="hint">Enter the 6-digit PIN to save rules.</p>
    <input type="text" id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" autocomplete="off" style="-webkit-text-security:disc">
    <p class="err" id="login-err"></p>
    <div class="sticky"><button class="btn ghost" id="login-cancel">Cancel</button><button class="btn" id="login-go">Unlock</button></div>
  </section>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
// ── Settings ──────────────────────────────────────────────
const THEATRES = {
  INTO: "INOX Marina Mall", PVHR: "PVR Heritage ECR", MCSK: "Miraj Sekaran Mall",
  TVHP: "Vijay Park Injambakkam", CBMC: "Cinepolis BSR Mall", MAYJ: "Mayajaal ECR", ACON: "AGS Navalur"
};
const RAW = "https://raw.githubusercontent.com/Hagema2025/bms-theatre-bot";
const API = "https://final-bms-bot.onrender.com";
const RULES_URL = API + "/api/rules";           // POST: bot API commits docs/rules.json to the data branch (like /api/tracking)
const PENDING_MIN = 6;                          // must outlast the ~5 min raw.githubusercontent.com cache
let SHA = null, SHA_UNTIL = 0;
try { const x = JSON.parse(localStorage.getItem("rules_sha")); if (x && /^[0-9a-f]{40}$/.test(x.sha) && x.until > Date.now()) { SHA = x.sha; SHA_UNTIL = x.until; } } catch {}
const activeSha = () => (SHA && Date.now() < SHA_UNTIL) ? SHA : null;
function useFreshSha(sha) {
  if (!/^[0-9a-f]{40}$/.test(sha || "")) return;
  SHA = sha; SHA_UNTIL = Date.now() + PENDING_MIN * 60000;
  try { localStorage.setItem("rules_sha", JSON.stringify({ sha: SHA, until: SHA_UNTIL })); } catch {}
}
const CUTOFF_MIN = 10;
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const BASE_LANGS = ["Tamil", "English", "Hindi", "Telugu", "Malayalam", "Kannada"];

// ── Helpers ───────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
// Telegram loads async so a slow telegram.org never blocks the page
let tg = null;
window.tgReady = () => { if (window.Telegram && window.Telegram.WebApp) { tg = window.Telegram.WebApp; try { tg.ready(); tg.expand(); } catch {} } };
window.tgReady();
let toastT;
function toast(m, ms = 4500) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }
const uid = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const blank = () => ({ id: uid(), name: "", enabled: true, venues: [], movie: "", languages: [], days: [], per_day: false, time: { from: "", to: "" }, day_times: {}, from: "", to: "", mode: "all", max_price: null });

const normRule = r => { const o = { ...blank(), ...r, mode: r.mode === "budget" ? "budget" : "all" }; delete o.categories; delete o.times; delete o.dimensions; delete o.screen; return o; };

const fmtWhen = iso => {
  const t = Date.parse(iso);
  return t ? new Date(t).toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "—";
};
function dateLabel(code) {
  const d = new Date(+code.slice(0, 4), +code.slice(4, 6) - 1, +code.slice(6));
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((d - t) / 86400000);
  const base = d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  const day = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : d.toLocaleDateString("en-IN", { weekday: "short" });
  return `${day}, ${base}`;
}
const ymd = code => new Date(+code.slice(0, 4), +code.slice(4, 6) - 1, +code.slice(6)).toLocaleDateString("en-IN", { day: "numeric", month: "short" });

// ── State ─────────────────────────────────────────────────
let rules = store.get("rules_draft", { rules: [] }).rules || [];
let saved = JSON.stringify(store.get("rules_saved", { rules: [] }).rules || []);
let live = [];                     // every unexpired show (includes ones past the tracking cutoff)
let shows = [];                    // live shows still open for tracking, for previews and suggestions
let threads = {};                  // docs/rule_threads.json: weekly Telegram topics
let token = sessionStorage.getItem("tracking_token") || null;
let draft = null, editingNew = false, pendingSave = false;
let openSecs = (() => { const o = store.get("rules_open", {}); return Array.isArray(o) ? {} : o; })();   // key -> open?
const config = () => ({ version: 1, updated: new Date().toISOString(), rules });
function persist() {
  store.set("rules_draft", { rules });
  $("dirty").hidden = JSON.stringify(rules) === saved;
}

// ── Load shows + weekly topics ────────────────────────────
async function loadShows() {
  const out = [];
  await Promise.all(Object.keys(THEATRES).map(async v => {
    try {
      const r = await fetch(`${RAW}/data/docs/state/${v}.json?t=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) return;
      const st = await r.json();
      for (const [d, day] of Object.entries(st)) {
        if (!/^\d{8}$/.test(d)) continue;
        for (const [id, s] of Object.entries(day)) out.push({ v, d, id, s });
      }
    } catch {}
  }));
  live = out.filter(x => Date.parse(x.s.end) > Date.now());
  shows = live.filter(x => Date.now() <= Date.parse(x.s.start) + CUTOFF_MIN * 60000);
  renderList();
}
async function loadThreads() {
  try {
    const r = await fetch(`${RAW}/data/docs/rule_threads.json?t=${Date.now()}`, { cache: "no-store" });
    if (r.status === 404) { threads = {}; renderList(); return; }
    if (!r.ok) return;
    const j = await r.json();
    if (j && typeof j === "object") { threads = j; renderList(); }
  } catch {}
}
const uniq = f => [...new Set(shows.map(x => String(f(x) || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));
const priced = s => Object.entries(s.classes || {}).filter(([n, c]) => n && Number(c.price) > 0);

// Shows a rule has already tracked (from the scanner's tracked_by_rules marks)
function trackedBy(rule) {
  const out = [];
  live.forEach(x => {
    const t = (x.s.tracked_by_rules || []).find(t => t.rule_id === rule.id);
    if (t) out.push({ ...x, at: t.tracked_at });
  });
  return out;
}
const topicsOf = rule => Object.values(threads).filter(t => t && t.rule_id === rule.id && t.thread_id)
  .sort((a, b) => String(a.week_start).localeCompare(String(b.week_start)) || String(a.venue).localeCompare(String(b.venue)));
function topicLink(t) {
  const id = String(t.chat_id || "").replace(/^-100/, "");
  return /^\d+$/.test(id) ? `https://t.me/c/${id}/${t.thread_id}` : "";
}

// ── Matching (same logic the worker should use) ───────────
const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
const PRESETS = { morning: { from: "", to: "11:59" }, afternoon: { from: "12:00", to: "16:59" }, evening: { from: "17:00", to: "20:59" }, night: { from: "21:00", to: "" }, any: { from: "", to: "" } };
function minIST(start) {
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date(start));
  return Number(p.find(x => x.type === "hour").value) * 60 + Number(p.find(x => x.type === "minute").value);
}
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const inWin = (w, m) => !w || ((!w.from || m >= toMin(w.from)) && (!w.to || m <= toMin(w.to)));
const t12 = t => { let [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2, "0")} ${ap}`; };
const winText = w => !w || (!w.from && !w.to) ? "" : w.from && w.to ? `${t12(w.from)}–${t12(w.to)}` : w.from ? `from ${t12(w.from)}` : `until ${t12(w.to)}`;
function ruleMatches(r, x) {
  const s = x.s, ci = (a, b) => String(a || "").toLowerCase().includes(String(b).toLowerCase());
  if (r.venues.length && !r.venues.includes(x.v)) return false;
  if (r.movie && !ci(s.movie, r.movie)) return false;
  if (r.languages.length && !r.languages.some(l => l.toLowerCase() === String(s.language || "").toLowerCase())) return false;
  const dow = new Date(+x.d.slice(0, 4), +x.d.slice(4, 6) - 1, +x.d.slice(6)).getDay();
  if (r.days.length && !r.days.includes(dow)) return false;
  if (!inWin(r.per_day ? (r.day_times || {})[dow] : r.time, minIST(s.start))) return false;
  if (r.from && x.d < r.from.replace(/-/g, "")) return false;
  if (r.to && x.d > r.to.replace(/-/g, "")) return false;
  return true;
}
// Which categories would be tracked on a show under the rule's category mode
function trackedCats(r, s) {

  return p;
}

// ── List ──────────────────────────────────────────────────
function describe(r) {
  const j = (a, m) => a.length ? a.slice(0, m).join(", ") + (a.length > m ? ` +${a.length - m}` : "") : "";
  const parts = [
    `<b>${r.venues.length ? esc(j(r.venues.map(v => THEATRES[v] || v), 2)) : "Any theatre"}</b>`,
    r.movie ? `movie “${esc(r.movie)}”` : "any movie",
    r.languages.length ? esc(j(r.languages, 3)) : "any language",
  ];
  const dd = DAY_ORDER.filter(x => r.days.includes(x));
  if (r.per_day && dd.length) parts.push(esc(dd.map(x => `${DAYS[x]} ${winText((r.day_times || {})[x]) || "all day"}`).join(", ")));
  else { parts.push(winText(r.time) ? esc(winText(r.time)) : "any time"); if (dd.length && dd.length < 7) parts.push(esc(dd.map(x => DAYS[x]).join(" "))); }
  if (r.from || r.to) parts.push(`${esc(r.from || "…")} to ${esc(r.to || "…")}`);
  parts.push(r.mode === "budget" ? `seats up to ₹${esc(r.max_price)}` : "all seat types");
  return parts.join(" · ");
}

// Tracked shows grouped: date > theatre > movie (language · format) > time chips
// ── Weeks: Monday to Sunday, same as the scanner's weekly topics ──
const toCode = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
function wkStart(code) {
  const d = new Date(+code.slice(0, 4), +code.slice(4, 6) - 1, +code.slice(6));
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return d;
}
const wkKey = code => toCode(wkStart(code));
function wkLabel(key) {
  const s = wkStart(key), e = new Date(s); e.setDate(e.getDate() + 6);
  const f = d => d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  return `${f(s)} – ${f(e)}`;
}
function wkTag(key) {
  const diff = Math.round((wkStart(key) - wkStart(toCode(new Date()))) / 604800000);
  return diff === 0 ? "This week" : diff === 1 ? "Next week" : "";
}

// Tracked shows of one theatre: date > movie (language · format) > time chips
function dayBlocks(arr) {
  const byDay = {};
  arr.forEach(x => (byDay[x.d] = byDay[x.d] || []).push(x));
  return Object.keys(byDay).sort().map(d => {
    const g = {};
    byDay[d].forEach(x => {
      const k = `${x.s.movie || "Show"}\u0000${x.s.language || ""}\u0000${x.s.dimension || ""}`;
      (g[k] = g[k] || []).push(x);
    });
    const movies = Object.entries(g).map(([k, a]) => {
      const [movie, lang, dim] = k.split("\u0000");
      a.sort((p, q) => Date.parse(p.s.start) - Date.parse(q.s.start));
      return { movie, lang, dim, a, first: Date.parse(a[0].s.start) };
    }).sort((p, q) => p.first - q.first || p.movie.localeCompare(q.movie));
    return `<div class="t-date">${esc(dateLabel(d))}</div>` + movies.map(m => `
      <div class="t-movie"><div class="t-title">${esc(m.movie)}</div>
        <div class="t-lang">${esc([m.lang, m.dim].filter(Boolean).join(" · "))}</div>
        <div class="t-chips">${m.a.map(x => `<span class="t-chip${Date.now() > Date.parse(x.s.start) ? " past" : ""}" title="${esc(x.s.screen || "")}">${esc(x.s.time)}</span>`).join("")}</div></div>`).join("");
  }).join("");
}

// One collapsible block per week: theatre > its Telegram topic > tracked shows
function weeksHtml(rule, tr, waitingList, tp) {
  const weeks = {};
  const W = k => (weeks[k] = weeks[k] || { tracked: [], waiting: 0, topics: [] });
  tr.forEach(x => W(wkKey(x.d)).tracked.push(x));
  waitingList.forEach(x => { W(wkKey(x.d)).waiting++; });
  tp.forEach(t => { if (t.week_start) W(String(t.week_start)).topics.push(t); });

  const order = Object.keys(THEATRES);
  return Object.keys(weeks).sort().map((k, i) => {
    const w = weeks[k];
    const sk = `${rule.id}:${k}`;
    const open = sk in openSecs ? openSecs[sk] : i === 0;
    const venues = [...new Set([...w.tracked.map(x => x.v), ...w.topics.map(t => t.venue)])]
      .sort((a, b) => order.indexOf(a) - order.indexOf(b));
    const bits = [];
    if (w.tracked.length) bits.push(`⚡ ${w.tracked.length} tracked`);
    if (venues.length) bits.push(`${venues.length} theatre${venues.length === 1 ? "" : "s"}`);
    if (w.waiting) bits.push(`⏳ ${w.waiting} waiting for next scan`);
    const tag = wkTag(k);

    const body = venues.length ? venues.map(v => {
      const t = w.topics.find(t => t.venue === v);
      const link = t ? topicLink(t) : "";
      const mine = w.tracked.filter(x => x.v === v);
      return `<div class="tp-head"><b>${esc(THEATRES[v] || v)}</b>
          ${link ? `<a href="${esc(link)}" data-tglink target="_blank" rel="noopener">Open topic ↗</a>` : `<span class="tp-none">${t ? "Topic created" : "No topic yet"}</span>`}</div>`
        + (mine.length ? dayBlocks(mine) : `<div class="empty">No shows tracked in this topic yet.</div>`);
    }).join("") : `<div class="empty">No topic yet. It is created on the next scan, then these shows get tracked.</div>`;

    return `<details class="wk" data-sec="${esc(sk)}" ${open ? "open" : ""}>
      <summary><span><span class="wk-title">${esc(wkLabel(k))}${tag ? `<span class="wk-tag">${tag}</span>` : ""}</span>
        <span class="wk-sub">${esc(bits.join(" · ") || "Nothing yet")}</span></span></summary>
      <div class="wk-body">${body}</div></details>`;
  }).join("");
}

function renderList() {
  persist();
  const savedRules = (() => { try { return JSON.parse(saved); } catch { return []; } })();
  const savedById = Object.fromEntries(savedRules.map(r => [r.id, JSON.stringify(r)]));

  const allTracked = new Set();

    ? `<div class="summary">⚡ ${activeN} of ${rules.length} rule${rules.length === 1 ? "" : "s"} on · ${allTracked.size} upcoming show${allTracked.size === 1 ? "" : "s"} auto-tracked in total</div>` : "";

      ? `<div class="match">${m.length} open show${m.length === 1 ? "" : "s"} match now · ${esc(movies.slice(0, 3).join(", "))}${movies.length > 3 ? ` +${movies.length - 3}` : ""}</div>`
      : `<div class="match none">No open shows match right now. It will catch new ones.</div>`;

    const theatreN = new Set(tr.map(x => x.v)).size, movieN = new Set(tr.map(x => x.s.movie)).size;

    const stats = tr.length ? `<div class="stats">

      : !r.enabled ? `<div class="waiting">Rule is off. The scanner ignores it until you switch it on.</div>` : "";

    const weeks = weeksHtml(r, tr, r.enabled && isSaved ? waitingList : [], topicsOf(r));

    return `<article class="rule ${r.enabled ? "" : "off"}">
      <div class="rule-top"><h2 class="rule-name">${esc(r.name || "Untitled rule")}${unsaved}</h2>
        <label class="sw"><input type="checkbox" data-toggle="${i}" ${r.enabled ? "checked" : ""} aria-label="Rule enabled"><span></span></label></div>
      <p class="rule-desc">${describe(r)}</p>${match}${stats}${note}${weeks}

}

// Pull text inputs into the draft

function validate() {
  const d = draft;
  if (!d.name) return "Enter a rule name. It becomes the Telegram thread name.";
  if (rules.some(r => r.id !== d.id && (r.name || "").trim().toLowerCase() === d.name.toLowerCase())) return "Another rule already uses this name.";
  if (d.mode === "budget" && !(d.max_price > 0)) return "Enter a maximum price in ₹.";
  if (d.from && d.to && d.from > d.to) return "The start date is after the end date.";
  const bad = w => w && w.from && w.to && w.from > w.to;
  if (d.per_day && d.days.length) {
    if (d.days.some(x => bad(d.day_times[x]))) return "A day's start time is after its end time.";
    d.day_times = Object.fromEntries(d.days.filter(x => d.day_times[x]).map(x => [x, d.day_times[x]]));
    d.time = { from: "", to: "" };

// ── Save to server (worker) ───────────────────────────────
async function login() {
  const pin = $("pin").value.trim(), er = $("login-err"), b = $("login-go");
  if (!/^\d{6}$/.test(pin)) { er.textContent = "Enter a valid 6-digit PIN."; return; }
  b.disabled = true; er.textContent = "Verifying…";
  try {
    const r = await fetch(API + "/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pin }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Login failed.");
    token = data.token; sessionStorage.setItem("tracking_token", token);
    $("login").hidden = true;
    if (pendingSave) { pendingSave = false; saveRules(); }
  } catch (e) { er.textContent = e.message || "Unable to connect."; }
  finally { b.disabled = false; }
}
async function saveRules() {
  if (!token) { pendingSave = true; $("pin").value = ""; $("login-err").textContent = ""; $("login").hidden = false; return; }
  const b = $("save"); b.disabled = true; b.textContent = "Saving…";
  const cfg = config();
  try {
    const r = await fetch(RULES_URL, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify(cfg) });
    if (r.status === 401) { token = null; sessionStorage.removeItem("tracking_token"); pendingSave = true; $("login").hidden = false; return; }
    if (!r.ok) { let m = ""; try { m = (await r.json()).error; } catch {} throw new Error(m || `Server returned ${r.status}.`); }
    const data = await r.json().catch(() => ({}));
    if (data.success === false || data.ok === false) throw new Error(data.error || data.message || "Save failed.");
    saved = JSON.stringify(rules); store.set("rules_saved", { rules, updated: cfg.updated }); persist();
    useFreshSha(data.commit_sha);
    renderList();
    toast("Rules saved to GitHub. The worker uses them on its next run.");
  } catch (e) {
    toast((e.message || "Could not reach the server.") + " Your rules are kept on this device. Use Import / Export to copy the JSON.", 7000);
  } finally { b.disabled = false; b.textContent = "Save rules"; }
}
async function getRemote() {
  const sha = activeSha(), urls = [];
  if (sha) urls.push(`${RAW}/${sha}/docs/rules.json`);          // fresh, never cached before
  urls.push(`${RAW}/data/docs/rules.json?t=${Date.now()}`);     // normal branch (may be ~5 min stale)
  for (const url of urls) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (r.status === 404) { if (url === urls[urls.length - 1]) return { rules: [] }; continue; }
      if (!r.ok) continue;
      return JSON.parse(await r.text());
    } catch {}
  }
  return null;
}
async function loadRemote() {
  if (draft || JSON.stringify(rules) !== saved) return;          // never overwrite an open editor or unsaved edits
  const c = await getRemote();
  if (!c || !Array.isArray(c.rules)) return;
  if (draft || JSON.stringify(rules) !== saved) return;
  const mine = store.get("rules_saved", {}).updated || "";
  if (mine && String(c.updated || "") < mine) return;            // GitHub hasn't caught up with our last save
  const next = c.rules.map(normRule);
  if (JSON.stringify(next) === saved) return;
  rules = next; saved = JSON.stringify(rules);
  store.set("rules_saved", { rules, updated: c.updated || mine }); renderList();
}

  if (draft && t.dataset.pt) { draft.time = { ...PRESETS[t.dataset.pt] }; renderTime(); preview(); return; }
  if (draft && t.dataset.perday !== undefined) { draft.per_day = !draft.per_day; renderTime(); preview(); return; }
  if (draft && t.dataset.copy !== undefined) {
    const ds = DAY_ORDER.filter(x => draft.days.includes(x));
    const first = draft.day_times[ds[0]] || { from: "", to: "" };
    ds.forEach(x => draft.day_times[x] = { ...first });
    renderTime(); preview(); return;
  }
  if (t.dataset.g && draft) {
    const arr = draft[t.dataset.g], val = t.dataset.g === "days" ? Number(t.dataset.val) : t.dataset.val;
    const i = arr.indexOf(val); if (i < 0) arr.push(val); else arr.splice(i, 1);
    t.setAttribute("aria-pressed", i < 0);
    if (t.dataset.g === "days") renderTime();
    preview();
  }
});
document.addEventListener("change", e => {
  if (e.target.dataset.toggle !== undefined) { rules[+e.target.dataset.toggle].enabled = e.target.checked; renderList(); return; }
  if (e.target.name === "mode") { modeUI(); }
  if (draft) preview();
});
document.addEventListener("input", e => {
  if (draft && e.target.dataset.t !== undefined) {
    const k = e.target.dataset.t;
    const w = k === "all" ? draft.time : (draft.day_times[k] = draft.day_times[k] || { from: "", to: "" });
    w[e.target.dataset.e] = e.target.value;
  }
  if (draft && e.target.closest("#ed-body") && e.target.id !== "f-name") preview(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { draft = null; $("ed").hidden = true; $("io-ov").hidden = true; }
  if (e.key === "Enter" && e.target.id === "pin") login();
});
window.addEventListener("beforeunload", e => { if (JSON.stringify(rules) !== saved) { e.preventDefault(); e.returnValue = ""; } });

renderList();
loadShows();
loadThreads();
loadRemote();
setInterval(() => { if (!document.hidden) { loadShows(); loadThreads(); } }, 120000);
setInterval(() => { if (!document.hidden) loadRemote(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadRemote(); loadShows(); } });
</script>
</body>
