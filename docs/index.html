<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticket Alerts</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>

:root {
  color-scheme: dark;
  --bg: #090b12;
  --panel: #121622;
  --panel-2: #191f2d;
  --line: rgba(255,255,255,.09);
  --fg: #f4f5f8;
  --muted: #929bad;
  --accent: #f6b94b;
  --accent-2: #ffda8a;
  --ok: #48c78e;
  --mid: #f4b544;
  --low: #ff776d;
  --off: #778092;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
body {
  font: 15px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  background:
    radial-gradient(ellipse at 85% -10%, rgba(246,185,75,.13), transparent 38%),
    radial-gradient(ellipse at -10% 35%, rgba(98,116,190,.10), transparent 34%),
    var(--bg);
}
header {
  padding: 26px 18px 18px;
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.brand { display:flex; align-items:center; gap:12px; min-width:0; }
.brand-mark {
  width: 42px; height: 42px; flex:none; display:grid; place-items:center;
  border-radius: 14px; color:#17120a; font-size:20px; font-weight:900;
  background: linear-gradient(145deg, var(--accent-2), #e99a25);
  box-shadow: 0 7px 24px rgba(246,185,75,.22);
}
h1 { font-size: 21px; line-height:1.1; margin:0; font-weight:800; letter-spacing:-.04em; }
.subhead { color:var(--muted); font-size:12px; margin-top:5px; }
#upd {
  color: var(--muted); font-size: 11px; text-align: right;
  background: rgba(255,255,255,.045); border:1px solid var(--line);
  padding:7px 10px; border-radius:999px; white-space:nowrap;
}
.nav-wrap { max-width:760px; margin:0 auto; }
.nav-label {
  padding: 0 18px 7px; color:var(--muted); font-size:10px;
  font-weight:800; letter-spacing:.14em; text-transform:uppercase;
}
.row {
  display:flex; gap:9px; overflow-x:auto; padding:5px 18px 16px;
  scrollbar-width:none; scroll-snap-type:x proximity;
}
.row::-webkit-scrollbar { display:none; }
.chip {
  flex:none; scroll-snap-align:start; border:1px solid var(--line);
  border-radius:13px; padding:10px 14px; font:inherit; font-size:13px;
  cursor:pointer; background:var(--panel); color:#cbd1dc;
  transition: .18s ease;
}
.chip[aria-pressed="true"] {
  color:#1b150b; background:linear-gradient(135deg,var(--accent-2),var(--accent));
  border-color:transparent; font-weight:800; box-shadow:0 5px 18px rgba(246,185,75,.15);
}
.chip small { display:block; font-size:10px; opacity:.72; margin-top:2px; }
#dates { padding-bottom:17px; }
#dates .chip { min-width:75px; text-align:center; }
main {
  max-width:760px; margin:0 auto; padding: 2px 18px 36px;
  display:grid; gap:12px;
}
.show {
  position:relative; overflow:hidden;
  background:linear-gradient(145deg, rgba(26,32,46,.98), rgba(17,21,31,.98));
  border:1px solid var(--line); border-radius:19px; padding:16px;
  display:grid; gap:14px; box-shadow:0 10px 30px rgba(0,0,0,.16);
}
.show:before {
  content:""; position:absolute; top:0; left:0; width:3px; height:100%;
  background:linear-gradient(180deg,var(--accent),transparent 85%); opacity:.8;
}
.top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.movie { font-weight:800; font-size:17px; line-height:1.25; letter-spacing:-.025em; }
.meta { color:var(--muted); font-size:12px; margin-top:5px; }
.tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
.tag {
  font-size:10px; font-weight:700; letter-spacing:.02em;
  padding:4px 8px; border-radius:7px; color:#e7c98f;
  background:rgba(246,185,75,.10); border:1px solid rgba(246,185,75,.12);
}
.time {
  flex:none; font-size:18px; font-weight:850; white-space:nowrap;
  font-variant-numeric:tabular-nums; color:var(--accent-2); text-align:right;
}
.dur { color:var(--muted); font-size:11px; font-weight:500; margin-top:3px; }
.classes {
  display:grid; gap:0; background:rgba(0,0,0,.16);
  border:1px solid rgba(255,255,255,.055); border-radius:12px; padding:3px 11px;
}
.cls { display:flex; align-items:center; gap:9px; font-size:12px; padding:9px 0; }
.cls + .cls { border-top:1px solid rgba(255,255,255,.055); }
.cls .name { flex:1; color:#e5e8ef; font-weight:650; }
.cls .st { color:var(--muted); font-size:11px; min-width:83px; text-align:right; }
.meter { display:inline-flex; gap:3px; flex:none; }
.meter i { width:6px; height:11px; border-radius:3px; background:#343c4c; }
.l3 i:nth-child(-n+3) { background:var(--ok); }
.l2 i:nth-child(-n+2) { background:var(--mid); }
.l1 i:nth-child(-n+1) { background:var(--low); }
.re { display:block; font-size:10px; color:var(--ok); font-weight:700; }
.actions { display:flex; gap:9px; }
.btn {
  flex:1; border:0; border-radius:11px; padding:11px 12px;
  font:inherit; font-size:12px; font-weight:800; cursor:pointer;
  background:linear-gradient(135deg,var(--accent-2),var(--accent));
  color:#1a1409; text-align:center; text-decoration:none;
  transition:transform .15s ease, filter .15s ease;
}
.btn:active { transform:scale(.98); }
.btn.alt { background:rgba(72,199,142,.10); color:#6ce0a9; box-shadow:inset 0 0 0 1px rgba(72,199,142,.35); }
.btn.off { background:rgba(255,255,255,.045); color:var(--muted); box-shadow:inset 0 0 0 1px var(--line); cursor:default; }
.btn.book { flex:none; min-width:88px; background:transparent; color:var(--accent-2); box-shadow:inset 0 0 0 1px rgba(246,185,75,.4); }
.msg {
  color:var(--muted); text-align:center; padding:46px 20px;
  background:var(--panel); border:1px dashed rgba(255,255,255,.13);
  border-radius:17px; font-size:13px;
}
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
@media (min-width:600px) {
  header { padding-top:34px; }
  .show { padding:19px; }
  .movie { font-size:19px; }
}
.filter-trigger {
  display:block;
  width:calc(100% - 36px);
  max-width:724px;
  margin:12px auto 16px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  color:var(--fg);
  font:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}
.filter-overlay[hidden] { display:none; }
.filter-overlay {
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.filter-backdrop {
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.72);
}
.filter-panel {
  position:relative;
  z-index:1;
  width:100%;
  max-width:600px;
  max-height:85vh;
  overflow-y:auto;
  padding:20px 18px 28px;
  padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
  background:var(--panel);
  border:1px solid var(--line);
  border-bottom:0;
  border-radius:20px 20px 0 0;
  box-shadow:0 -8px 30px rgba(0,0,0,.3);
}
.filter-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  color:var(--fg);
  font-size:16px;
}
.filter-close {
  border:0;
  background:var(--panel-2);
  color:var(--fg);
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  font:inherit;
}
.filter-wrap {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.filter-wrap select {
  width:100%;
  min-width:0;
  padding:12px 9px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--fg);
  font:inherit;
  font-size:12px;
}
.filter-wrap button {
  grid-column:1 / -1;
  padding:11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel-2);
  color:var(--muted);
  font:inherit;
  font-size:12px;
  cursor:pointer;
}
@media (min-width:600px) {
  .filter-overlay { align-items:center; padding:20px; }
  .filter-panel { border-bottom:1px solid var(--line); border-radius:20px; }
}

/* Category tracking panel */
.category-overlay[hidden] { display:none; }

.category-overlay {
  position:fixed;
  inset:0;
  z-index:1100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(5px);
}

.category-panel {
  width:100%;
  max-width:560px;
  max-height:85vh;
  overflow-y:auto;
  padding:22px 20px calc(25px + env(safe-area-inset-bottom, 0px));
  background:linear-gradient(160deg,#182438,#101827 72%);
  border:1px solid var(--line);
  border-radius:24px 24px 0 0;
}

.category-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:18px;
  margin-bottom:8px;
}

.category-sub {
  color:var(--muted);
  font-size:12px;
  margin-bottom:17px;
}

.mode-option {
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:14px 12px;
  margin-bottom:9px;
  border:1px solid var(--line);
  border-radius:13px;
  background:rgba(255,255,255,.035);
  cursor:pointer;
}

.mode-option input {
  width:18px;
  height:18px;
  margin-top:2px;
  accent-color:var(--accent);
}

.mode-option span {
  display:grid;
  gap:4px;
}

.mode-option b {
  font-size:13px;
}

.mode-option small {
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}

#budget-area, #manual-area {
  padding:10px 12px 15px;
}

.budget-label {
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:8px;
}

#category-budget {
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--panel-2);
  color:var(--fg);
  font:inherit;
}

.category-check {
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 9px;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

.category-check input {
  width:17px;
  height:17px;
  accent-color:var(--accent);
}

.category-check span { flex:1; }

.category-price {
  color:var(--muted);
  font-size:11px;
}

.category-actions {
  display:flex;
  gap:10px;
  margin-top:17px;
}

.category-actions button {
  flex:1;
  min-height:45px;
  border-radius:12px;
  font:inherit;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.category-cancel {
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--fg);
}

.category-start {
  border:0;
  background:linear-gradient(135deg,var(--accent-2),var(--accent));
  color:#1a1409;
}

@media (min-width:600px) {
  .category-overlay { align-items:center; padding:20px; }
  .category-panel { border-radius:24px; }
}

/* ── Mobile-Optimized Grid Layout ─────────────────────── */
.show-header {
  display: grid;
  grid-template-columns: 85px 1fr; /* Locks poster width to 85px, text takes the rest */
  gap: 15px;
  align-items: start;
}
.poster {
  width: 100%;
  aspect-ratio: 2 / 3; /* Maintains perfect movie poster proportions */
  height: auto;
  object-fit: cover;
  border-radius: 10px;
  background: rgba(255,255,255,0.03);
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
.show-info {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.movie-title-wrap {
  display: flex;
  align-items: flex-start;
  gap: 7px;
}
.movie {
  font-weight: 800;
  font-size: 16px;
  line-height: 1.2;
  letter-spacing: -0.02em;
}
.censor-badge {
  font-size: 9px;
  font-weight: 800;
  padding: 2px 5px;
  border: 1px solid rgba(186, 204, 232, 0.2);
  border-radius: 5px;
  color: #a5b2c4;
  line-height: 1.2;
  margin-top: 1px;
}
.genre {
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
}
/* New Time Row integrated into the info column */
.show-time-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-top: 4px;
  padding-top: 10px;
  border-top: 1px dashed rgba(255,255,255,0.08);
}
.time {
  font-size: 16px;
  font-weight: 850;
  color: var(--accent-2);
}
.dur {
  font-size: 11px;
  color: var(--muted);
}
.btn.trailer {
  flex: none;
  min-width: 45px;
  padding: 0;
  background: rgba(255,255,255,0.05);
  color: #edf2f8;
  box-shadow: inset 0 0 0 1px rgba(186, 204, 232, 0.15);
  font-size: 16px; 
}

/* Multi-show selection */
.show-select {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}
.show-select input {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}
.batch-bar {
  position: sticky;
  bottom: 12px;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  margin: 0 auto 16px;

  max-width: 724px;
  border: 1px solid var(--line);
  border-radius: 15px;

}
.batch-bar[hidden] { display: none; }
.batch-count { flex: 1; font-size: 12px; color: var(--muted); }


/* Batch bar: wrap so 3 buttons fit on small screens + progress bar */
.batch-bar { flex-wrap: wrap; overflow: hidden; padding-bottom: 14px; }
.batch-bar .batch-count { flex: 1 1 100%; }
.batch-bar .btn { flex: 1; min-height: 40px; }
.btn:disabled { opacity: .55; cursor: default; }
.batch-progress {
  position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
  background: rgba(255,255,255,.08); overflow: hidden;
}
.batch-progress[hidden] { display: none; }
.batch-progress i {

}
@keyframes bp { 0% { left: -40%; } 100% { left: 100%; } }

/* Info toast (auto-hides after 5s) */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 1200;
  max-width: min(92vw, 420px); padding: 11px 15px; border-radius: 13px;
  background: #2a1f12; border: 1px solid rgba(245,189,89,.45);
  color: #ffe3a8; font-size: 12px; font-weight: 600; line-height: 1.4;
  box-shadow: 0 8px 25px #0009;
}
.toast[hidden] { display: none; }

/* View selection panel */
.sel-item { display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-bottom: 1px solid var(--line); }
.sel-item .info { flex: 1; min-width: 0; }
.sel-item b { display: block; font-size: 13px; }
.sel-item small { color: var(--muted); font-size: 11px; }
.btn.sel-remove { flex: none; min-height: 34px; padding: 0 12px; }

/* Select all bar */
.select-bar { max-width: 760px; margin: 0 auto; padding: 0 18px 12px; display: flex; justify-content: flex-end; }
.select-bar[hidden] { display: none; }
.select-bar .btn { flex: none; min-height: 38px; padding: 0 16px; }

/* Grouped selection view */
.sel-date { margin: 14px 0 4px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-2); }

.sel-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sel-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #f3d39a; background: rgba(245,189,89,.09); border: 1px solid rgba(245,189,89,.18); }
.sel-chip button { width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.1); color: var(--fg); font-size: 10px; cursor: pointer; }

/* Sort + group headers */
.mode-option[hidden] { display: none; }
.grp-head { margin: 8px 2px 0; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-2); }
.grp-head:first-child { margin-top: 0; }

</style>

<script>

// Set to true only while debugging. It shows a green log panel to the user.
const DEBUG = false;

function debugLog(...args) {
  if (!DEBUG) return;

  const panel = document.getElementById("debug-panel");
  const output = document.getElementById("debug-output");

  if (!panel || !output) return;

  panel.style.display = "block";

  const line = args.map(x => {
    try {
      return typeof x === "object"
        ? JSON.stringify(x)
        : String(x);
    } catch {
      return String(x);
    }
  }).join(" ");

  output.textContent += line + "\n";
  panel.scrollTop = panel.scrollHeight;
}

// ── Settings ──────────────────────────────────────────────
const BOT = "Bms_ticketAlert_bot";
const CUTOFF_MIN = 10;
const PENDING_MIN = 6;   // must outlast the ~5 min raw.githubusercontent.com cache
const LOCAL_TTL = PENDING_MIN * 60000;   // how long an API-confirmed result overrides the file
const THEATRES = {
  INTO: "INOX Marina Mall", PVHR: "PVR Heritage ECR", MCSK: "Miraj Sekaran Mall",
  TVHP: "Vijay Park Injambakkam", CBMC: "Cinepolis BSR Mall", MAYJ: "Mayajaal ECR", ACON: "AGS Navalur"
};
const STATUS = { "3": "Available", "2": "Filling fast", "1": "Almost full", "0": "Sold out" };
const EMPTY_FILTERS = { movie: "", language: "", dimension: "", screen: "", time: "" };

// Fresh commit passed in by the bot's "Back to app" button (?sha=<40 hex chars>)
const SHA_PARAM = new URLSearchParams(location.search).get("sha") || "";
let SHA = /^[0-9a-f]{40}$/.test(SHA_PARAM) ? SHA_PARAM : null;
let SHA_UNTIL = Date.now() + PENDING_MIN * 60000;
const activeSha = () => (SHA && Date.now() < SHA_UNTIL) ? SHA : null;

// Pin tracking reads to a commit we know contains our change
function useFreshSha(sha) {
  if (/^[0-9a-f]{40}$/.test(sha || "")) {
    SHA = sha;
    SHA_UNTIL = Date.now() + PENDING_MIN * 60000;
  }
}

// ── State ─────────────────────────────────────────────────
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const S = {
  venue: store.get("venue", "INTO"),
  date: null,
  state: {}, track: {}, updated: {}, failed: {},
  filters: { ...EMPTY_FILTERS },
  selected: new Set(),
  local: {}   // API-confirmed results: key -> { tracked, ts, mode, max_price, categories }
};
if (S.venue !== "ALL" && !THEATRES[S.venue]) S.venue = "INTO";

S.sort = (() => {
  const x = store.get("sort", null);
  if (x && ["time", "movie", "theatre"].includes(x.by) && ["asc", "desc"].includes(x.dir)) return x;
  return { by: "time", dir: "asc" };
})();

// "ALL" means every theatre at once
const venuesOf = v => v === "ALL" ? Object.keys(THEATRES) : [v];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

// ── Data ──────────────────────────────────────────────────
const RAW = "https://raw.githubusercontent.com/Hagema2025/bms-theatre-bot";

async function getJson(folder, venue) {
  const sha = folder === "tracking" ? activeSha() : null;
  const urls = [];
  if (sha) urls.push(`${RAW}/${sha}/docs/${folder}/${venue}.json`);       // fresh, never cached before
  urls.push(`${RAW}/data/docs/${folder}/${venue}.json?t=${Date.now()}`);  // normal branch (may be ~5 min stale)

  for (const url of urls) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      debugLog("FETCH:", url, r.status);
      if (r.status === 404) {
        if (url === urls[urls.length - 1]) return {};
        continue;                       // SHA not ready yet, try the branch
      }
      if (!r.ok) continue;
      return JSON.parse(await r.text());
    } catch (e) {
      debugLog("FETCH ERROR:", String(e));
    }
  }
  return null;
}

async function loadState(venue) {
  const st = await getJson("state", venue);
  S.failed[venue] = st === null;
  if (st) {
    S.updated[venue] = st._updated;
    delete st._updated;
    S.state[venue] = st;
  }
}

// Turns combo records into { date: { session: entry } } so the rest of the app is unchanged.
// Old date-keyed entries (legacy) are still read.
function flattenTracking(tr) {
  const out = {};
  for (const [k, v] of Object.entries(tr || {})) {
    if (/^\d{8}$/.test(k)) {                          // legacy: date -> session -> entry
      out[k] = { ...(out[k] || {}), ...v };
    } else if (v && v.tracking && v.date) {           // combo record
      out[v.date] = out[v.date] || {};
      for (const [sid, e] of Object.entries(v.tracking)) out[v.date][sid] = e;
    }
  }
  return out;
}

const trackingRequestId = {};
async function loadTracking(venue) {
  const requestId = (trackingRequestId[venue] || 0) + 1;
  trackingRequestId[venue] = requestId;

  const tr = await getJson("tracking", venue);

  // Ignore an older request if a newer request has started
  if (requestId !== trackingRequestId[venue]) {
    debugLog("IGNORED OLD TRACKING RESPONSE", { venue, requestId });
    return;
  }

  if (tr !== null) {
    S.track[venue] = flattenTracking(tr);
    debugLog("TRACKING DATA UPDATED", { venue, requestId, fetchedAt: new Date().toISOString() });
  } else {
    debugLog("TRACKING FETCH FAILED", { venue, requestId, time: new Date().toISOString() });
  }
}

async function load(venue) {
  await Promise.all(venuesOf(venue).map(v => Promise.all([loadState(v), loadTracking(v)])));
}

// Tracking info for one show. A short-lived overlay (S.local) from the API
// response takes priority until the GitHub file catches up or the TTL expires.
function trackOf(v, d, s) {
  const key = `${v}_${d}_${s}`;
  const base = (((S.track[v] || {})[d] || {})[s]) || {};
  const o = S.local[key];
  if (!o) return base;

  // Expired, or the file has caught up -> drop overlay
  if (Date.now() - o.ts > LOCAL_TTL || !!base.tracked === o.tracked) {
    delete S.local[key];
    return base;
  }
  return o.tracked
    ? { ...base, tracked: true, mode: o.mode, max_price: o.max_price, categories: o.categories }
    : { ...base, tracked: false };
}
const isTracked = (v, d, s) => !!trackOf(v, d, s).tracked;

// ── Pending (waiting for bot) ─────────────────────────────
// Has the bot's saved data caught up with what the user asked for?
function confirmed(p, t) {
  if (p.a === "unt") return !t.tracked;

  if (!t.tracked) return false;

  const i = p.intent;
  if (!i) return true;

  const tMode = t.mode || "all";
  if (tMode !== i.mode) return false;

  if (i.mode === "budget") {
    const saved = Number(t.max_price);
    const expected = Number(i.max_price);
    return Number.isFinite(saved) &&
           Number.isFinite(expected) &&
           Math.abs(saved - expected) < 0.01;
  }

  if (i.mode === "manual") {
    const normalize = cats =>
      [...new Set(Array.isArray(cats) ? cats : [])].sort();

    return JSON.stringify(normalize(t.categories)) ===
           JSON.stringify(normalize(i.categories));
  }

  return true;
}

// Returns the pending action ("trk" / "unt") or null.
// Expired entries are NOT deleted here, so prunePending() can warn the user.
function pending(v, d, s) {
  const key = `${v}_${d}_${s}`;
  const all = store.get("pend", {});
  const p = all[key];
  if (!p) return null;

  if (Date.now() - p.ts > PENDING_MIN * 60000) return null;

  if (confirmed(p, trackOf(v, d, s))) {
    delete all[key];
    store.set("pend", all);
    return null;
  }
  return p.a;
}

function prunePending() {
  const all = store.get("pend", {});
  let changed = false;

  for (const [key, p] of Object.entries(all)) {
    const [v, d, id] = key.split("_");
    const expired = Date.now() - p.ts > PENDING_MIN * 60000;
    const isConfirmed = !!S.track[v] && confirmed(p, trackOf(v, d, id));

    debugLog("PENDING STATUS:", { key, expired, isConfirmed });

    if (expired || isConfirmed) {
      delete all[key];
      changed = true;
      if (expired && !isConfirmed) {
        notify("Couldn't confirm your last request. Open the bot in Telegram to check, then try again.");
      }
    }
  }

  if (changed) store.set("pend", all);
}

// ── Category tracking selection ──────────────────────────
let categorySelection = null;
let batchSelection = [];

function notify(msg) {
  if (tg && tg.showAlert && tg.isVersionAtLeast("6.2")) {
    tg.showAlert(msg);
  } else {
    alert(msg);
  }
}

const TRACKING_API = "https://final-bms-bot.onrender.com";

let trackingToken = sessionStorage.getItem("tracking_token") || null;

function openLogin() {
  const overlay = $("login-overlay");
  overlay.hidden = false;
  overlay.style.display = "flex";
  $("tracking-pin").value = "";
  $("login-error").textContent = "";
}

function closeLogin() {
  $("login-overlay").hidden = true;
  $("login-overlay").style.display = "none";
}

async function trackingLogin() {
  const pin = $("tracking-pin").value.trim();
  const error = $("login-error");
  const button = $("login-submit");

  if (!/^\d{6}$/.test(pin)) {
    error.textContent = "Enter a valid 6-digit PIN.";
    return false;
  }

  button.disabled = true;
  error.textContent = "Verifying...";

  try {
    const response = await fetch(`${TRACKING_API}/api/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pin })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Login failed.");
    }

    trackingToken = data.token;
    sessionStorage.setItem("tracking_token", trackingToken);

    closeLogin();
    return true;

  } catch (e) {
    error.textContent = e.message || "Unable to connect.";
    return false;

  } finally {
    button.disabled = false;
  }
}

// Decide whether one entry of data.results means success.
// Adjust this if your backend uses different field names.
function resultOk(r) {
  if (!r) return false;
  if (typeof r.success === "boolean") return r.success;
  if (typeof r.ok === "boolean") return r.ok;
  return ["ok", "success", "tracked"].includes(String(r.status || "").toLowerCase());
}

let batchBusy = false;

function setBatchBusy(on) {
  batchBusy = on;
  $("batch-continue").disabled = on;
  $("batch-clear").disabled = on;
  $("batch-view").disabled = on;
  $("batch-continue").textContent = on ? "Tracking…" : "Track Selected";
  $("batch-progress").hidden = !on;
  updateBatchUI();
}

async function submitBatchTracking(actions, intents = {}) {
  if (batchBusy) return;

  if (!trackingToken) {
    preparedBatchActions = actions;       // keep for retry after login
    preparedBatchIntents = intents;
    openLogin();
    return;
  }

  setBatchBusy(true);

  try {
    const response = await fetch(`${TRACKING_API}/api/tracking`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${trackingToken}`
      },
      body: JSON.stringify({ actions })
    });

    const data = await response.json();

    if (response.status === 401) {
      trackingToken = null;
      sessionStorage.removeItem("tracking_token");
      preparedBatchActions = actions;     // keep for retry after login
      preparedBatchIntents = intents;
      openLogin();
      return;
    }

    if (!response.ok) {
      throw new Error(data.error || "Tracking request failed.");
    }

    const results = Array.isArray(data.results) ? data.results : [];
    const failedLines = [];

    actions.forEach((a, i) => {
      const key = `${a.venue}_${a.date}_${a.session}`;
      const r = results[i];

      if (resultOk(r)) {
        S.local[key] = {
          tracked: true,
          ts: Date.now(),
          ...(intents[key] || { mode: "all", max_price: null, categories: [] })
        };
        S.selected.delete(key);
      } else {
        const show = ((S.state[a.venue] || {})[a.date] || {})[a.session];
        failedLines.push(
          `• ${show ? show.movie + " " + show.time : key}` +
          (r && (r.message || r.error) ? " – " + (r.message || r.error) : "")
        );
        // failed shows stay selected so the user can retry
      }
    });

    renderList();      // buttons update instantly from the API response
    updateBatchUI();

    // Backend returns commit_sha on each successful result (same commit for all).
    // Read the tracking file at that exact commit so it is fresh, not cached.
    const sha = data.commit_sha || (results.find(r => r && r.commit_sha) || {}).commit_sha;
    if (sha) {
      useFreshSha(sha);
      refreshTracking([...new Set(actions.map(a => a.venue))]);   // not awaited, so the alert below isn't delayed
    }

    if (failedLines.length) {
      notify(
        `Tracked: ${data.succeeded}\n` +
        `Failed: ${data.failed}\n\n` +
        failedLines.join("\n")
      );
    }
    // No toast on full success: the buttons turning green is the feedback.

  } catch (e) {
    console.error("Batch tracking error:", e);
    notify(e.message || "Unable to submit batch tracking.");
  } finally {
    setBatchBusy(false);
  }
}

function openBatchCategoryPicker() {

  for (const key of S.selected) {

    const show = ((S.state[v] || {})[d] || {})[id];

    if (!show || isTracked(v, d, id) || closed(show) || pending(v, d, id)) {

      .filter(([name, c]) => name && Number(c.price) > 0);

  }

  batchSelection = shows;

  const categoryMap = new Map();

      categoryMap.set(name, (categoryMap.get(name) || 0) + 1);
    });
  });

  $("category-sub").textContent =
    `${shows.length} shows selected · Same selection for all`;

    const minPrice = Math.min(...prices);

    const priceLabel = minPrice === maxPrice

let preparedBatchActions = [];
let preparedBatchIntents = {};

function saveCategorySelection() {
  const isBatch = batchSelection.length > 0;

  if (!isBatch && !categorySelection) return;

  const mode =
    document.querySelector('input[name="track-mode"]:checked')?.value || "all";

  const maxPrice = Math.round(Number($("category-budget").value));

  const checked = [
    ...document.querySelectorAll(
      "#category-options input[type=checkbox]:checked"
    )
  ].map(i => i.value);

  if (mode === "budget" &&
      (!Number.isFinite(maxPrice) || maxPrice <= 0)) {
    return notify("Please enter a valid maximum price.");
  }

  if (mode === "manual" && !checked.length) {
    return notify("Please select at least one category.");
  }

  // ── Batch tracking ─────────────────────────────
  if (isBatch) {
    const actions = [];
    const intents = {};

    for (const item of batchSelection) {
      const { v, d, id, classes } = item;

      let selection = "a";
      let intent = { mode: "all", max_price: null, categories: [] };

      if (mode === "budget") {
        selection = "b" + maxPrice;
        intent = { mode: "budget", max_price: maxPrice, categories: [] };
      }

      if (mode === "manual") {
        let mask = 0;
        const names = [];

        classes.forEach(([name], i) => {
          if (checked.includes(name)) {
            mask |= (1 << i);
            names.push(name);
          }
        });

        // Don't submit an empty manual selection
        if (mask === 0) continue;

        selection = "m" + mask.toString(36);
        intent = { mode: "manual", max_price: null, categories: names };
      }

      actions.push({
        action: "track",
        venue: v,
        session: id,
        date: d,
        selection
      });
      intents[`${v}_${d}_${id}`] = intent;
    }

    if (!actions.length) {
      return notify("No selected categories match these shows.");
    }

    preparedBatchActions = actions;
    preparedBatchIntents = intents;

    closeCategoryPicker();
    batchSelection = [];

    return submitBatchTracking(actions, intents);
  }

  // ── Existing individual tracking ───────────────
  const { v, d, id, classes } = categorySelection;

  let extra = "a";

  if (mode === "budget") {
    extra = "b" + maxPrice;
  }

  if (mode === "manual") {
    let mask = 0;

    classes.forEach(([name], i) => {
      if (checked.includes(name)) {
        mask |= (1 << i);
      }
    });

    extra = "m" + mask.toString(36);
  }

  const intent = {
    mode,
    max_price: mode === "budget" ? maxPrice : null,
    categories: mode === "manual" ? checked : []
  };

  closeCategoryPicker();

  press("trk", `${v}_${d}_${id}`, extra, intent);
}

const live = show => Date.parse(show.end) > Date.now();
const closed = show => Date.now() > Date.parse(show.start) + CUTOFF_MIN * 60000;

function dateLabel(code) {
  const d = new Date(+code.slice(0, 4), +code.slice(4, 6) - 1, +code.slice(6));
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((d - t) / 86400000);
  const base = d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  const day = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : d.toLocaleDateString("en-IN", { weekday: "short" });
  return { day, base };
}

// Set innerHTML only if it changed, so the DOM isn't replaced needlessly
function setHtml(el, html) {
  if (el.dataset.h === html) return false;
  el.dataset.h = html;
  el.innerHTML = html;
  return true;
}

function datesFor(v) {

  for (const x of venuesOf(v)) {

function button(v, d, id, show) {
  const key = `${v}_${d}_${id}`;
  const action = pending(v, d, id);

  // Waiting for the bot: honest "syncing" state with an escape hatch
  if (action) {
    const pend = store.get("pend", {})[key];
    const intent = pend?.intent;
    let label = action === "unt" ? "Stopping…" : "Syncing…";

    if (action === "trk" && intent) {
      if (intent.mode === "manual") {
        label = `Syncing · ${intent.categories.join(", ")}`;
      } else if (intent.mode === "budget") {
        label = `Syncing · Under ₹${intent.max_price}`;
      } else {
        label = "Syncing · All Categories";
      }
    }

    return `<button class="btn off" disabled data-wait="${key}">🟡 ${esc(label)} · <span class="cd"></span></button>
            <button class="btn off" data-a="cancel" data-k="${key}">Cancel</button>`;
  }

  // Confirmed by the API response or by the file
  if (isTracked(v, d, id)) {
    // Edit/Stop open Telegram and close the app, which would lose the selection
    if (S.selected.size > 0) {
      return `<button class="btn alt" disabled>✓ Tracking</button>
              <button class="btn off" disabled>Stop</button>`;
    }
    return `<button class="btn alt" data-a="edit" data-k="${key}">✓ Tracking · Edit</button>
            <button class="btn off" data-a="unt" data-k="${key}">Stop</button>`;
  }

  if (closed(show)) {
    return `<button class="btn off" disabled>Tracking closed</button>`;
  }

  // Batch selection is active, so block single-show tracking
  if (S.selected.size > 0) {
    return `<button class="btn off" disabled>Multi-select active</button>`;
  }

  return `<button class="btn" data-a="pick" data-k="${key}">Track this show</button>`;
}

function matchesFilters(show) {
  const f = S.filters;
  if (f.movie && show.movie !== f.movie) return false;
  if (f.language && show.language !== f.language) return false;
  if (f.dimension && show.dimension !== f.dimension) return false;
  if (f.screen && show.screen !== f.screen) return false;
  if (f.time) {
    const hour = Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", hourCycle: "h23" })
      .formatToParts(new Date(show.start)).find(p => p.type === "hour").value);
    if (f.time === "morning" && !(hour < 12)) return false;
    if (f.time === "afternoon" && !(hour >= 12 && hour < 17)) return false;
    if (f.time === "evening" && !(hour >= 17 && hour < 21)) return false;
    if (f.time === "night" && !(hour >= 21 || hour < 5)) return false;
  }
  return true;
}

// Drop selected shows that can no longer be tracked. Returns true if anything changed.
function pruneSelection() {
  const gone = [];
  let changed = false;

  for (const key of [...S.selected]) {
    const [v, d, id] = key.split("_");
    if (!S.state[v]) continue;                 // venue not loaded yet, keep it
    const show = ((S.state[v] || {})[d] || {})[id];
    const unavailable = !show || closed(show) || !live(show);

    if (unavailable || isTracked(v, d, id) || pending(v, d, id)) {
      S.selected.delete(key);
      changed = true;
      if (unavailable) gone.push(show ? `${show.movie} ${show.time}` : "A selected show");
    }
  }

  if (gone.length) {
    showToast(gone.length === 1
      ? `${gone[0]} is no longer available and was removed from your selection.`
      : `${gone.length} selected shows are no longer available and were removed from your selection.`);
  }
  if (changed) updateBatchUI();
  return changed;
}

function renderSelection() {
  const keys = [...S.selected];
  $("sel-sub").textContent = `${keys.length} show${keys.length === 1 ? "" : "s"} selected`;

  // date -> theatre -> movie -> (language + dimension) -> shows
  const tree = {};
  keys.forEach(key => {
    const [v, d, id] = key.split("_");
    const show = ((S.state[v] || {})[d] || {})[id] || {};
    const movie = show.movie || "Show " + id;
    const start = Date.parse(show.start) || 0;
    const lang = show.language || "—";
    const dim = show.dimension || "—";
    const gk = lang + "\u0000" + dim;

    tree[d] = tree[d] || {};
    tree[d][v] = tree[d][v] || {};
    const m = tree[d][v][movie] = tree[d][v][movie] || { groups: {} };
    const g = m.groups[gk] = m.groups[gk] || { lang, dim, items: [] };
    g.items.push({ key, time: show.time || "", start, screen: show.screen || "" });
  });

  const venueOrder = Object.keys(THEATRES);

  $("sel-list").innerHTML = Object.keys(tree).sort().map(d => {
    const dl = dateLabel(d);
    const venues = Object.keys(tree[d]).sort((a, b) => venueOrder.indexOf(a) - venueOrder.indexOf(b));

    return `<div class="sel-date">${esc(dl.day)}, ${esc(dl.base)}</div>` + venues.map(v => {
      // Movies in alphabetical order
      const movies = Object.entries(tree[d][v])
        .map(([name, m]) => ({ name, m }))
        .sort((a, b) => a.name.localeCompare(b.name));

      // Movie A (all its language/dimension combos) -> Movie B -> ...
      return `<div class="sel-theatre">${esc(THEATRES[v] || v)}</div>` + movies.map(({ name, m }) => {
        const groups = Object.values(m.groups);
        groups.forEach(g => { g.first = Math.min(...g.items.map(i => i.start)); });

        // Earliest start per language, so a language's combos stay together
        const langFirst = {};
        groups.forEach(g => { langFirst[g.lang] = Math.min(langFirst[g.lang] ?? Infinity, g.first); });

        // Same language together (earliest language first), then its combos by start time
        groups.sort((a, b) =>
          langFirst[a.lang] - langFirst[b.lang] ||
          a.lang.localeCompare(b.lang) ||
          a.first - b.first ||
          a.dim.localeCompare(b.dim));

        return groups.map(g => `
          <div class="sel-movie">
            <div class="sel-title">${esc(name)}</div>
            <span class="sel-lang">${esc(g.lang)} · ${esc(g.dim)}</span>
            <div class="sel-chips">${g.items.sort((a, b) => a.start - b.start).map(it =>
              `<span class="sel-chip"${it.screen ? ` title="${esc(it.screen)}"` : ""}>${esc(it.time)}<button type="button" data-sel-remove="${esc(it.key)}" aria-label="Remove ${esc(it.time)}">✕</button></span>`
            ).join("")}</div>
          </div>`).join("");
      }).join("");
    }).join("");
  }).join("");
}

// ── Sorting ───────────────────────────────────────────────
function effectiveSort() {
  let { by, dir } = S.sort;
  if (by === "theatre" && S.venue !== "ALL") by = "movie";   // same thing for one theatre
  if (by !== "time") dir = "asc";
  return { by, dir };
}

function sortLabel({ by, dir }) {
  return by === "time" ? (dir === "asc" ? "Time ↑" : "Time ↓")
    : by === "movie" ? "Movie A–Z" : "Theatre";
}

function sortItems(items) {
  const { by, dir } = effectiveSort();
  const order = Object.keys(THEATRES);
  const vi = it => order.indexOf(it.v);
  const st = it => Date.parse(it.s.start) || 0;
  const movie = it => String(it.s.movie || "");
  const lang = it => String(it.s.language || "—");
  const dim = it => String(it.s.dimension || "—");

  if (by === "time") {
    const sign = dir === "desc" ? -1 : 1;
    return items.sort((a, b) =>
      (st(a) - st(b)) * sign || vi(a) - vi(b) || movie(a).localeCompare(movie(b)));
  }

  // movie / theatre: inside one (theatre + movie), same-language combos stay together,
  // languages and combos ordered by earliest start, shows in start order.
  const gk = it => it.v + "\u0000" + movie(it);
  const langFirst = {}, comboFirst = {};
  items.forEach(it => {
    const lk = gk(it) + "\u0000" + lang(it);
    const ck = lk + "\u0000" + dim(it);
    langFirst[lk] = Math.min(langFirst[lk] ?? Infinity, st(it));
    comboFirst[ck] = Math.min(comboFirst[ck] ?? Infinity, st(it));
  });
  const lf = it => langFirst[gk(it) + "\u0000" + lang(it)];
  const cf = it => comboFirst[gk(it) + "\u0000" + lang(it) + "\u0000" + dim(it)];

  const inner = (a, b) =>
    lf(a) - lf(b) || lang(a).localeCompare(lang(b)) ||
    cf(a) - cf(b) || dim(a).localeCompare(dim(b)) || st(a) - st(b);

  return items.sort(by === "movie"
    ? (a, b) => movie(a).localeCompare(movie(b)) || vi(a) - vi(b) || inner(a, b)
    : (a, b) => vi(a) - vi(b) || movie(a).localeCompare(movie(b)) || inner(a, b));
}

    const genre = s.genre ? `<div class="genre">${esc(s.genre).replace(/,/g, ", ")}</div>` : "";
    const posterImg = s.poster ? `<img src="https://assets-in.bmscdn.com/iedb/movies/images/mobile/thumbnail/xlarge/${s.poster}.jpg" class="poster" loading="lazy" onerror="this.style.display='none'">` : "";
    const trailerBtn = s.trailer ? `<a class="btn trailer" href="${esc(s.trailer)}" target="_blank" rel="noopener" aria-label="Watch Trailer">▶️</a>` : "";

    const classes = Object.entries(s.classes || {}).map(([name, c]) => `
      <div class="cls"><span class="meter l${esc(c.status)}" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="name">${esc(name)} ₹${esc(c.price)}</span><span class="st">${STATUS[c.status] || ""}${c.first_seen_status === "0" && c.status !== "0" ? '<span class="re">reopened</span>' : ""}</span></div>`).join("");

    const canSelect = !isTracked(v, S.date, id)
      && !closed(s)
      && !pending(v, S.date, id);

    const selectBox = canSelect ? `
      <label class="show-select">
        <input type="checkbox"
          data-select-key="${key}"
          ${S.selected.has(key) ? "checked" : ""}>
        Select show
      </label>` : "";

    return headHtml + `<article class="show">
    ${selectBox}
      <div class="show-header">
        ${posterImg}
        <div class="show-info">
          <div class="movie-title-wrap">
            <div class="movie">${esc(s.movie)}</div>
            ${censor}
          </div>
          ${genre}
          <div class="meta">${meta}</div>
          ${tags ? `<div class="tags">${tags}</div>` : ""}

          <div class="show-time-row">
            <div class="time">${esc(s.time)}</div>
            <div class="dur">${dur}</div>
          </div>
        </div>
      </div>
      <div class="classes">${classes}</div>
      <div class="actions">
        ${button(v, S.date, id, s)}
        ${trailerBtn}
        <a class="btn book" href="${esc(s.url)}" target="_blank" rel="noopener">Book</a>
      </div>
    </article>`;
  }).join("");

  setHtml(el, html);
  tickCountdown();
  updateFilterUI();
  updateBatchUI();
}

function renderUpdated() {
  const el = $("upd");
  const us = venuesOf(S.venue).map(x => S.updated[x]).filter(Boolean);
  if (!us.length) { el.textContent = ""; return; }
  const u = us.reduce((a, b) => Date.parse(a) <= Date.parse(b) ? a : b);   // oldest of the loaded theatres
  const m = Math.max(0, Math.round((Date.now() - Date.parse(u)) / 60000));
  el.textContent = m < 1 ? "Data Updated just now" : m < 60 ? `Data Updated ${m} min ago` : `Data Updated ${Math.round(m / 60)} h ago`;
}


function renderAll() {
  renderVenues();
  renderDates();
  renderFilters();
  renderList();
  renderUpdated();
}

function updateBatchUI() {
  const count = S.selected.size;
  const plural = count === 1 ? "" : "s";

  $("batch-bar").hidden = count === 0;
  $("batch-count").textContent = batchBusy
    ? `Tracking ${count} show${plural}…`
    : `${count} show${plural} selected`;

  if (!$("sel-overlay").hidden) {
    if (count === 0) closeSelection(); else renderSelection();
  }
  updateSelectAll();
}
function updateFilterUI() {
  const n = Object.values(S.filters).filter(Boolean).length;
  $("filter-clear-quick").hidden = n === 0;
  $("filter-open").innerHTML = n
    ? `⚙ Filters <span style="background:var(--accent);color:#000;padding:2px 6px;border-radius:6px;margin-left:4px">${n}</span>`
    : `⚙ Filters`;
}

// ── Actions ───────────────────────────────────────────────

function press(action, key, extra = "", intent = null) {
  const [v, d, id] = key.split("_");
  const pend = store.get("pend", {});

  // A new request makes any older SHA stale, so stop using it
  SHA = null;
  delete S.local[key];   // hand control back to the file-based pending logic

  pend[key] = {
    a: action,
    ts: Date.now(),
    intent
  };

  store.set("pend", pend);

  const link =
    `https://t.me/${BOT}?start=${action}_${v}_${id}_${d}` +
    (extra ? "_" + extra : "");

  debugLog("Generated Telegram URL:", link);

  renderList();


  if (tg && tg.openTelegramLink) {
    tg.openTelegramLink(link);
    // Close the Mini App so the user lands in the bot chat and taps "Back to app"
    setTimeout(() => { try { tg.close(); } catch {} }, 300);
  } else {
    window.open(link, "_blank");   // normal browser: leave the page open
  }

}

function clearFilters() {
  S.filters = { ...EMPTY_FILTERS };
  $("filters").dataset.h = "";      // force rebuild
  renderFilters();
  renderList();
}

document.addEventListener("click", async e => {
  if (e.target.closest("[data-filter-close]")) {
    $("filter-overlay").hidden = true;
    renderFilters();
    return;
  }
  const t = e.target.closest("button");
  if (!t) return;

  if (t.dataset.selRemove) {
    S.selected.delete(t.dataset.selRemove);
    renderList();
    return;
  }
  if (t.id === "batch-view") { openSelection(); return; }
  if (t.id === "sel-close" || t.id === "sel-done") { closeSelection(); return; }
  if (t.id === "select-all") {
    if (batchBusy) return;
    const keys = selectableKeys();
    const allOn = keys.every(k => S.selected.has(k));
    keys.forEach(k => allOn ? S.selected.delete(k) : S.selected.add(k));
    renderList();
    return;
  }

  if (t.id === "category-close" || t.id === "category-cancel") return closeCategoryPicker();
  if (t.id === "category-save") return saveCategorySelection();
  if (t.id === "filter-open") { $("filter-overlay").hidden = false; return; }
  if (t.id === "sort-open") { updateSortUI(); $("sort-overlay").hidden = false; return; }
  if (t.id === "sort-close" || t.id === "sort-done") { $("sort-overlay").hidden = true; return; }
  if (t.id === "filter-clear-quick" || t.dataset.filterReset !== undefined) return clearFilters();

  if (t.dataset.v) {
    S.venue = t.dataset.v;
    store.set("venue", S.venue);
    S.date = null;
    renderAll();
    await load(S.venue);
    prunePending();
    renderAll();
  } else if (t.dataset.d) {
    S.date = t.dataset.d;
    renderDates();
    renderFilters();
    renderList();
  } else if (t.dataset.a === "pick" || t.dataset.a === "edit") {
    const [v, d, id] = t.dataset.k.split("_");
    const show = ((S.state[v] || {})[d] || {})[id];
    if (show) openCategoryPicker(v, d, id, show);
  } else if (t.dataset.a === "unt") {
    press("unt", t.dataset.k);
  } else if (t.dataset.a === "cancel") {
    const all = store.get("pend", {});
    delete all[t.dataset.k];
    store.set("pend", all);
    renderList();
  }

  if (t.id === "batch-clear") {
    if (batchBusy) return;
    S.selected.clear();
    renderList();
    return;
  }

  if (t.id === "batch-continue") {
    if (batchBusy) return;
    openBatchCategoryPicker();
    return;
  }

  if (t.id === "login-cancel") {
    preparedBatchActions = [];
    preparedBatchIntents = {};
    closeLogin();
    return;
  }

  if (t.id === "login-submit") {
    const success = await trackingLogin();

    if (success && preparedBatchActions.length) {
      const actions = [...preparedBatchActions];
      const intents = { ...preparedBatchIntents };
      preparedBatchActions = [];
      preparedBatchIntents = {};
      await submitBatchTracking(actions, intents);
    }

    return;
  }
});

document.addEventListener("change", e => {
  if (e.target.name === "track-mode") return updateCategoryMode();
  if (e.target.name === "sort-mode") {
    const [by, dir] = e.target.value.split("-");
    S.sort = { by, dir };
    store.set("sort", S.sort);
    renderList();
    return;
  }
  if (e.target.id && e.target.id.startsWith("filter-")) {
    S.filters[e.target.id.replace("filter-", "")] = e.target.value;
    renderList();
  }
  if (e.target.matches("[data-select-key]")) {
    const key = e.target.dataset.selectKey;

    const before = S.selected.size;

    if (e.target.checked) {
      S.selected.add(key);
    } else {
      S.selected.delete(key);
    }

    updateBatchUI();
    // Redraw cards only when crossing between 0 and 1+ selected
    if ((before === 0) !== (S.selected.size === 0)) renderList();
    return;
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    $("filter-overlay").hidden = true;
    $("sort-overlay").hidden = true;
    closeSelection();
    if (categorySelection) closeCategoryPicker();
  }
});

// ── Refresh loops ─────────────────────────────────────────
async function refreshAll() {
  const venue = S.venue;
  await load(venue);
  prunePending();
  if (venue === S.venue) renderAll();
}

async function refreshState() {
  const venue = S.venue;
  await Promise.all(venuesOf(venue).map(loadState));
  if (venue === S.venue) { renderDates(); renderFilters(); renderList(); renderUpdated(); }
}

// Refresh tracking for the given theatres (default: whatever is on screen)
async function refreshTracking(vs) {
  await Promise.all((vs || venuesOf(S.venue)).map(v => loadTracking(v)));
  prunePending();
  renderList();   // setHtml skips the DOM if nothing changed
}

// Countdown: only updates text, never rebuilds buttons
function tickCountdown() {
  const waits = document.querySelectorAll("[data-wait]");
  if (!waits.length) return;
  const all = store.get("pend", {});
  let expired = false;
  waits.forEach(b => {
    const p = all[b.dataset.wait];
    const left = p ? Math.max(0, PENDING_MIN * 60 - Math.floor((Date.now() - p.ts) / 1000)) : 0;
    if (!left) expired = true;
    const cd = b.querySelector(".cd");
    if (cd) cd.textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
  });
  if (expired) { prunePending(); renderList(); }
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshAll(); });
setInterval(() => { if (!document.hidden) refreshState(); }, 30000);

// Fast polling only while a Telegram-bot request is pending; slow background sync otherwise
setInterval(() => {
  if (document.hidden) return;
  // Only theatres that have a pending Telegram request need the fast poll
  const pv = [...new Set(Object.keys(store.get("pend", {})).map(k => k.split("_")[0]))].filter(x => THEATRES[x]);
  if (pv.length) refreshTracking(pv);
}, 5000);
setInterval(() => { if (!document.hidden) refreshTracking(); }, 60000);

setInterval(() => { if (!document.hidden) tickCountdown(); }, 1000);

// Catch shows that hit the cutoff while you are still on the page
setInterval(() => { if (!document.hidden && pruneSelection()) renderList(); }, 1000);

renderAll();
refreshAll();
</script>

  position:fixed;

  color:#00ff90;
  padding:10px;
  border:1px solid #555;

  font:11px monospace;

">

    <button onclick="document.getElementById('debug-panel').style.display='none'">Close</button>
  </div>
