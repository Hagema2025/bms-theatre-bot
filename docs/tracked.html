<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracked Shows</title>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="window.tgReady&&window.tgReady()"></script>
<style>
:root{color-scheme:dark;--bg:#080c14;--panel:#111927;--line:rgba(186,204,232,.12);--fg:#f5f7fb;--muted:#9aa9bd;--accent:#f5bd59;--accent-2:#ffdf9b;--ok:#48d6a0;--mid:#f5bd59;--low:#ff817b;--rule:#a78bfa}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
body{font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:radial-gradient(ellipse at 50% -18%,rgba(245,189,89,.16),transparent 43%),var(--bg)}
header{padding:28px 18px 22px;max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:15px;color:#17120a;font-size:20px;background:linear-gradient(145deg,var(--accent-2),#e99a25);box-shadow:0 8px 28px rgba(245,189,89,.2)}
h1{font-size:20px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.03em}
.subhead{color:var(--muted);font-size:12px;margin-top:4px}
main{max-width:760px;margin:0 auto;padding:24px 18px 36px}
.msg{color:#aab7c8;text-align:center;padding:46px 20px;background:rgba(17,25,39,.78);border:1px dashed rgba(186,204,232,.18);border-radius:19px;font-size:13px}
.btn{flex:1;min-height:43px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:11px 12px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#1a1409;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.book{flex:none;min-width:100%;margin-top:14px;background:transparent;color:var(--accent-2);box-shadow:inset 0 0 0 1px rgba(245,189,89,.38)}

/* overlays */
.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;z-index:1100;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,6,13,.76);backdrop-filter:blur(5px)}
.panel{width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:22px 20px calc(25px + env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,#182438,#101827 72%);border:1px solid var(--line);border-radius:24px 24px 0 0}
.panel-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:8px;gap:10px}
.panel-sub{color:var(--muted);font-size:12px;margin-bottom:17px}
.x{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.055);color:#e8edf5;font:inherit;font-size:14px;cursor:pointer}
@media(min-width:600px){.overlay{align-items:center;padding:20px}.panel{border-radius:24px}}

/* seat classes */
.classes{background:rgba(5,10,18,.28);border:1px solid rgba(186,204,232,.08);border-radius:14px;padding:3px 13px}
.cls{display:flex;align-items:center;gap:9px;font-size:12px;padding:10px 0}
.cls+.cls{border-top:1px solid rgba(255,255,255,.055)}
.cls .name{flex:1;color:#e8edf5;font-weight:650}
.cls .st{color:#a5b2c4;font-size:11px;min-width:83px;text-align:right}
.meter{display:inline-flex;gap:3px;flex:none}
.meter i{width:6px;height:11px;border-radius:3px;background:#343c4c}
.l3 i:nth-child(-n+3){background:var(--ok)}
.l2 i:nth-child(-n+2){background:var(--mid)}
.l1 i:nth-child(-n+1){background:var(--low)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
.tag{font-size:10px;font-weight:700;padding:4px 9px;border-radius:999px;color:#f3d39a;background:rgba(245,189,89,.09);border:1px solid rgba(245,189,89,.16)}

/* movie > language > format row > tiles */
.movie{padding:12px;margin-bottom:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(21,32,49,.98),rgba(14,21,33,.98));box-shadow:0 8px 22px rgba(0,0,0,.16)}
.movie-head{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;margin-bottom:6px}
.movie-head.no-poster{grid-template-columns:1fr}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:rgba(255,255,255,.03);box-shadow:0 5px 15px rgba(0,0,0,.3)}
.movie-name{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.movie-meta{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:6px;color:var(--muted);font-size:11px}
.censor-badge{font-size:9px;font-weight:800;padding:2px 5px;border:1px solid rgba(186,204,232,.2);border-radius:5px;color:#a5b2c4;line-height:1.2}
.lang-block{margin-top:12px}
.lang-head{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--accent-2);margin:0 2px 6px}
.fmt-row{margin-bottom:8px}
.fmt-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 6px;font-size:12px;font-weight:700;color:#d4dce8}
.fmt-head small{color:var(--muted);font-size:10px;font-weight:600;margin-left:6px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0;padding:9px 10px;border:1px solid rgba(72,214,160,.45);border-radius:12px;background:rgba(72,214,160,.08);cursor:pointer}
.tile.soldout{opacity:.45}
.tile.closed{opacity:.3}
.t1{display:flex;align-items:center;gap:6px;min-width:0}
.tile-time{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.t1 .sub-badge{margin:0 0 0 auto}
.t2{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-width:0;font-size:10px;color:var(--muted)}
.tile-screen{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-fmt{display:flex;flex-wrap:wrap;gap:2px 5px;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-2)}
.t3{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:5px;min-height:18px}
.avail{display:inline-flex;gap:3px}
.avail i{width:14px;height:7px;border-radius:3px;background:#4a5468}
.avail i.s3{background:var(--ok)}.avail i.s2{background:var(--mid)}.avail i.s1{background:var(--low)}
.sub-badge{position:relative;display:inline-block;padding:0 4px;border:1px solid var(--ok);border-radius:3px;color:var(--ok);font-size:8px;font-weight:800;line-height:1.35;letter-spacing:.03em}
.sub-badge:after{content:"";position:absolute;left:3px;bottom:-4px;width:4px;height:4px;background:var(--bg);border-right:1px solid var(--ok);border-bottom:1px solid var(--ok);transform:skewX(-35deg) rotate(35deg) translateY(-1px)}
.detail-time{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.detail-time b{font-size:20px;color:var(--accent-2)}
.detail-time span{color:var(--muted);font-size:12px}

.rule-banner{margin:0 0 14px;padding:10px 13px;border-radius:13px;font-size:12px;font-weight:700;color:#d9ccff;background:rgba(167,139,250,.09);border:1px solid rgba(167,139,250,.28)}
.rule-mark{color:var(--rule);font-size:12px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark" aria-hidden="true" id="h-icon">🎟️</div>
    <div>
      <h1 id="h-title">Loading...</h1>
      <div class="subhead" id="h-sub"></div>
    </div>
  </div>
</header>

<main id="list">
  <div class="msg">Fetching live data...</div>
</main>

<div class="overlay" id="detail-overlay" hidden>
  <section class="panel" role="dialog" aria-modal="true">
    <div class="panel-head"><strong id="detail-title">Show</strong><button type="button" class="x" id="detail-close">✕</button></div>
    <div id="detail-body"></div>
  </section>
</div>

<script>
// ── Settings ──────────────────────────────────────────────
const RAW = "https://raw.githubusercontent.com/Hagema2025/bms-theatre-bot/data";
const THEATRES = {
  INTO: "INOX Marina Mall", PVHR: "PVR Heritage ECR", MCSK: "Miraj Sekaran Mall",
  TVHP: "Vijay Park Injambakkam", CBMC: "Cinepolis BSR Mall", MAYJ: "Mayajaal ECR", ACON: "AGS Navalur"
};
const STATUS = { "3": "Available", "2": "Filling fast", "1": "Almost full", "0": "Sold out" };
const CUTOFF_MIN = 0;
const PENDING_MIN = 6;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const closed = show => Date.now() > Date.parse(show.start) + CUTOFF_MIN * 60000;
const live = show => Date.parse(show.end) > Date.now();

// ── Telegram Init ─────────────────────────────────────────
let tg = null;
window.tgReady = () => { if (window.Telegram && window.Telegram.WebApp) { tg = window.Telegram.WebApp; try { tg.ready(); tg.expand(); } catch {} } };
window.tgReady();

// ── Params ────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const viewType = params.get("view");       
const venue = (params.get("venue") || "").toUpperCase();

// Combo specific params
const targetDate = params.get("date");     
const targetMovie = params.get("movie");
const targetLang = params.get("language");
const targetDim = params.get("dimension");

// Rule specific params
const ruleId = params.get("rule_id");      
const weekStart = params.get("week");
// ── Data Fetching ─────────────────────────────────────────
async function fetchJson(path) {
  try {
    const r = await fetch(`${RAW}/docs/${path}?t=${Date.now()}`, { cache: "no-store" });
    if (r.ok) return await r.json();
  } catch (e) {}
  return null;
}

// ── State ─────────────────────────────────────────────────
let stateData = {};
let trackingData = {};
let rulesData = [];
let showsToRender = []; // Array of { d: date, id: session, s: show }

// ── Rule Logic (from rules.html) ──────────────────────────
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const minIST = start => {
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date(start));
  return Number(p.find(x => x.type === "hour").value) * 60 + Number(p.find(x => x.type === "minute").value);
};
const inWin = (w, m) => !w || ((!w.from || m >= toMin(w.from)) && (!w.to || m <= toMin(w.to)));
const priced = s => Object.entries(s.classes || {}).filter(([n, c]) => n && Number(c.price) > 0);

function ruleMatches(r, d, s) {
  const ci = (a, b) => String(a || "").toLowerCase().includes(String(b).toLowerCase());
  if (r.venues && r.venues.length && !r.venues.includes(venue)) return false;
  if (r.movie && !ci(s.movie, r.movie)) return false;
  if (r.languages && r.languages.length && !r.languages.some(l => l.toLowerCase() === String(s.language || "").toLowerCase())) return false;
  const dow = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6)).getDay();
  if (r.days && r.days.length && !r.days.includes(dow)) return false;
  if (!inWin(r.per_day ? (r.day_times || {})[dow] : r.time, minIST(s.start))) return false;
  if (r.from && d < r.from.replace(/-/g, "")) return false;
  if (r.to && d > r.to.replace(/-/g, "")) return false;
  return true;
}

function trackedCats(r, s) {
  const p = priced(s);
  if (r.mode === "budget") return p.filter(([, c]) => Number(c.price) <= Number(r.max_price));
  return p;
}

// ── Flatten Tracking (from index.html) ────────────────────
function flattenTracking(tr) {
  const out = {};
  for (const [k, v] of Object.entries(tr || {})) {
    if (/^\d{8}$/.test(k)) {
      out[k] = { ...(out[k] || {}), ...v };
    } else if (v && v.tracking && v.date) {
      out[v.date] = out[v.date] || {};
      for (const [sid, e] of Object.entries(v.tracking)) out[v.date][sid] = e;
    }
  }
  return out;
}

// ── Rendering Helpers ─────────────────────────────────────
function dateLabel(code) {
  const d = new Date(+code.slice(0, 4), +code.slice(4, 6) - 1, +code.slice(6));
  return d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
}

function fmtDur(m) { return m ? `${Math.floor(m / 60)}h ${m % 60}m` : ""; }

function fmtTags(s) {
  const dim = String(s.dimension || "").toUpperCase();
  return (s.tags || []).map(t => String(t).trim()).filter(t => t && !dim.includes(t.toUpperCase()));
}
function subBadge(s) {
  if (!s.subs) return "";
  const c = String(s.subs).replace(/\s*subs?$/i, "").trim();
  const label = !c || /^subtitles$/i.test(c) ? "SUB" : c;
  return `<span class="sub-badge">${esc(label)}</span>`;
}

function mostCommon(arr) {
  const c = {}; let best = "", n = 0;
  arr.forEach(x => { c[x] = (c[x] || 0) + 1; if (c[x] > n) { n = c[x]; best = x; } });
  return best;
}

const bestStatus = s => Math.max(0, ...priced(s).map(([, c]) => Number(c.status) || 0));
const soldOut = s => priced(s).length > 0 && bestStatus(s) === 0;

function groupShows(items) {
  const st = it => Date.parse(it.s.start) || 0;
  const movies = {};
  items.forEach(it => {
    const name = String(it.s.movie || "");
    const m = movies[name] = movies[name] || { name, first: Infinity, items: [], langs: {} };
    m.first = Math.min(m.first, st(it));
    m.items.push(it);
    const lang = String(it.s.language || "—"), dim = String(it.s.dimension || "—");
    const l = m.langs[lang] = m.langs[lang] || { lang, first: Infinity, items: [], dims: {} };
    l.first = Math.min(l.first, st(it));
    l.items.push(it);
    const d = l.dims[dim] = l.dims[dim] || { dim, first: Infinity, items: [] };
    d.first = Math.min(d.first, st(it));
    d.items.push(it);
  });
  return Object.values(movies).sort((a, b) => a.first - b.first).map(m => {
    const langs = Object.values(m.langs).sort((a, b) => a.first - b.first);
    langs.forEach(l => {
      l.list = Object.values(l.dims).sort((a, b) => a.first - b.first);
      l.list.forEach(d => d.items.sort((a, b) => st(a) - st(b)));
    });
    m.list = langs;
    return m;
  });
}

function tileHtml(it) {
  const { d, id, s } = it;
  const dim = soldOut(s);
  const cls = ["tile", closed(s) ? "closed" : "", dim ? "soldout" : ""].join(" ");
  const fmt = fmtTags(s).map(t => `<span>${esc(t)}</span>`).join("");
  const cats = priced(s).sort((a, b) => Number(a[1].price) - Number(b[1].price));
  const bars = cats.map(([n, c]) => `<i class="s${esc(c.status)}" title="${esc(n)} ₹${esc(c.price)} · ${esc(STATUS[c.status] || "")}"></i>`).join("");
  return `<div class="${cls}" data-open="${esc(d)}_${esc(id)}" role="button" tabindex="0">
    <div class="t1"><span class="tile-time">${esc(s.time)}</span>${subBadge(s)}</div>
    ${s.screen || fmt ? `<div class="t2">${s.screen ? `<span class="tile-screen">${esc(s.screen)}</span>` : ""}${fmt ? `<span class="tile-fmt">${fmt}</span>` : ""}</div>` : ""}
    <div class="t3"><span class="avail">${bars}</span></div>
  </div>`;
}

function movieHtml(m) {
  const shows = m.items.map(i => i.s);
  const sorted = [...shows].sort((a, b) => Date.parse(a.start) - Date.parse(b.start));
  const withPoster = sorted.find(s => s.poster) || sorted[0];
  const withCensor = sorted.find(s => s.censor) || sorted[0];
  const movieDur = Number(mostCommon(shows.map(s => s.duration).filter(Boolean))) || 0;
  
  const poster = withPoster.poster ? `<img src="https://assets-in.bmscdn.com/iedb/movies/images/mobile/thumbnail/xlarge/${esc(withPoster.poster)}.jpg" class="poster" loading="lazy" onerror="this.style.display='none'">` : "";
  const censor = withCensor.censor ? `<span class="censor-badge">${esc(withCensor.censor)}</span>` : "";
  const dur = movieDur ? `<span>${esc(fmtDur(movieDur))}</span>` : "";
  
  const langs = m.list.map(l => {
    const rows = l.list.map(d => {
      const rowDur = Number(mostCommon(d.items.map(i => i.s.duration).filter(Boolean))) || 0;
      const durNote = rowDur && rowDur !== movieDur ? `<small>${esc(fmtDur(rowDur))}</small>` : "";
      return `<div class="fmt-row">
        <div class="fmt-head"><span>${esc(d.dim === "—" ? "Standard" : d.dim)}${durNote}</span></div>
        <div class="tiles">${d.items.map(tileHtml).join("")}</div>
      </div>`;
    }).join("");
    return `<div class="lang-block"><div class="lang-head"><span>${esc(l.lang)}</span></div>${rows}</div>`;
  }).join("");

  return `<div class="movie">
    <div class="movie-head${poster ? "" : " no-poster"}">
      ${poster}
      <div>
        <h2 class="movie-name">${esc(m.name)}</h2>
        <div class="movie-meta">${censor}${dur}</div>
      </div>
    </div>
    ${langs}
  </div>`;
}

function renderShows() {
  if (!showsToRender.length) {
    $("list").innerHTML = `<div class="msg">No tracked shows available.</div>`;
    return;
  }
  
  // Group by date first if viewing rule (which spans a week), otherwise just group movies
  let html = "";
  if (viewType === "rule") {
    const byDate = {};
    showsToRender.forEach(x => (byDate[x.d] = byDate[x.d] || []).push(x));
    Object.keys(byDate).sort().forEach(d => {
      html += `<div style="font-size:12px;font-weight:800;color:var(--accent-2);margin:16px 0 8px;letter-spacing:0.08em;text-transform:uppercase">${esc(dateLabel(d))}</div>`;
      html += groupShows(byDate[d]).map(movieHtml).join("");
    });
  } else {
    html = groupShows(showsToRender).map(movieHtml).join("");
  }
  
  $("list").innerHTML = html;
}

// ── Detail Sheet ──────────────────────────────────────────
document.addEventListener("click", e => {
  if (e.target.id === "detail-close" || e.target.id === "detail-overlay") {
    $("detail-overlay").hidden = true;
    return;
  }
  const tile = e.target.closest("[data-open]");
  if (tile) {
    const [d, id] = tile.dataset.open.split("_");
    const s = ((stateData || {})[d] || {})[id];
    if (!s) return;

    const dur = fmtDur(s.duration);
    const meta = [THEATRES[venue] || venue, s.language, s.dimension, s.screen].filter(Boolean).map(esc).join(" · ");
    const tags = [...(s.tags || []), ...(s.subs ? [s.subs] : [])].map(t => `<span class="tag">${esc(t)}</span>`).join("");
    const classes = Object.entries(s.classes || {}).map(([name, c]) => `
      <div class="cls"><span class="meter l${esc(c.status)}" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="name">${esc(name)} ₹${esc(c.price)}</span><span class="st">${STATUS[c.status] || ""}</span></div>`).join("");

    $("detail-title").textContent = s.movie || "Show";
    $("detail-body").innerHTML = `
      <div class="panel-sub">${meta}</div>
      <div class="detail-time"><b>${esc(s.time)}</b><span>${dur}</span></div>
      ${tags ? `<div class="tags">${tags}</div>` : ""}
      <div class="classes">${classes}</div>
      <a class="btn book" href="${esc(s.url)}" target="_blank" rel="noopener">Book on BookMyShow</a>`;
    $("detail-overlay").hidden = false;
  }
});

// ── Initialization ────────────────────────────────────────
async function init() {
  if (!THEATRES[venue]) {
    $("list").innerHTML = `<div class="msg">Invalid venue code.</div>`;
    return;
  }

  stateData = await fetchJson(`state/${venue}.json`);
  if (!stateData) {
    $("list").innerHTML = `<div class="msg">Couldn't load data for ${esc(THEATRES[venue])}.</div>`;
    return;
  }

if (viewType === "tracked") {
    $("h-icon").textContent = "🎟️";
    $("h-title").textContent = targetMovie || THEATRES[venue];
    
    // Build a nice subheader
    const subParts = [THEATRES[venue], dateLabel(targetDate), targetLang, targetDim].filter(Boolean);
    $("h-sub").textContent = subParts.join(" · ");

    const rawTracking = await fetchJson(`tracking/${venue}.json`);
    const tracking = flattenTracking(rawTracking);
    const dayTracking = tracking[targetDate] || {};
    const dayState = stateData[targetDate] || {};
    
    showsToRender = [];
    for (const [id, s] of Object.entries(dayState)) {
      if (dayTracking[id] && dayTracking[id].tracked && live(s)) {
        // Filter out shows that don't match the combo topic
        if (targetMovie && s.movie !== targetMovie) continue;
        if (targetLang && s.language !== targetLang) continue;
        if (targetDim && s.dimension !== targetDim) continue;
        
        showsToRender.push({ d: targetDate, id, s });
      }
    }
  } else if (viewType === "rule") {
    const rulesObj = await fetchJson("rules.json");
    rulesData = rulesObj && rulesObj.rules ? rulesObj.rules : [];
    const rule = rulesData.find(r => r.id === ruleId);
    
    if (!rule) {
      $("h-title").textContent = "Rule Not Found";
      $("list").innerHTML = `<div class="msg">The rule you are looking for does not exist or was deleted.</div>`;
      return;
    }

    $("h-icon").textContent = "⚡";
    $("h-title").textContent = rule.name;
    $("h-sub").textContent = `${THEATRES[venue]} · Matching shows`;
    
    // Calculate week bounds (Monday to Sunday) based on weekStart (e.g. "20261109")
    const wsYear = +weekStart.slice(0, 4);
    const wsMonth = +weekStart.slice(4, 6) - 1;
    const wsDay = +weekStart.slice(6);
    const startDate = new Date(wsYear, wsMonth, wsDay);
    const endDate = new Date(startDate);
    endDate.setDate(endDate.getDate() + 6); // Add 6 days for Sunday

    const startCode = weekStart;
    const endCode = `${endDate.getFullYear()}${String(endDate.getMonth() + 1).padStart(2, "0")}${String(endDate.getDate()).padStart(2, "0")}`;

    showsToRender = [];
    for (const [d, day] of Object.entries(stateData)) {
      if (/^\d{8}$/.test(d) && d >= startCode && d <= endCode) {
        for (const [id, s] of Object.entries(day)) {
          if (live(s) && ruleMatches(rule, d, s) && trackedCats(rule, s).length > 0) {
            showsToRender.push({ d, id, s });
          }
        }
      }
    }
  } else {
    $("h-title").textContent = "Error";
    $("list").innerHTML = `<div class="msg">Invalid view type.</div>`;
    return;
  }

  renderShows();
}

init();
</script>
</body>
</html>
